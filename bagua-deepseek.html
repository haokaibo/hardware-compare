<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>阴阳五行八卦 · 四象 · 道法自然</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: "Noto Serif SC", "宋体", "仿宋", "楷体", serif;
      background-color: #0a0f1a;
    }
    /* 左上角合并面板 */
    #main-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #e0d5b7;
      background: rgba(10, 15, 26, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(200, 180, 120, 0.4);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      z-index: 20;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 180px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      cursor: pointer;
      user-select: none;
      background: rgba(255,255,200,0.03);
      border-bottom: 1px solid rgba(200,180,120,0.2);
    }
    .header-text {
      display: flex;
      flex-direction: column;
    }
    .header-text h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 500;
      color: #f5e7c8;
      line-height: 1.3;
    }
    .header-text p {
      margin: 2px 0 0;
      font-size: 0.7rem;
      opacity: 0.8;
      color: #ccbb99;
    }
    .panel-toggle-btn {
      background: none;
      border: none;
      color: #dac07b;
      font-size: 24px;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,200,0.1);
    }
    .panel-toggle-btn:hover {
      background: rgba(255,255,200,0.25);
    }
    .panel-body {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    /* 切换按钮样式 */
    .toggle-btn {
      background: rgba(255,255,200,0.15);
      border: 1px solid rgba(200,180,120,0.5);
      color: #ccbb99;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .toggle-btn.active {
      background: rgba(212, 175, 55, 0.3);
      border-color: #d4af37;
      color: #f5e7c8;
      box-shadow: 0 0 8px rgba(212,175,55,0.3);
    }
    .toggle-btn:hover {
      background: rgba(255,255,200,0.25);
    }
    /* 折叠状态 - 仅显示logo大小 */
    #main-panel.collapsed {
      min-width: 0;
      border-radius: 50%;
      border: 1px solid rgba(200,180,120,0.4);
    }
    #main-panel.collapsed .panel-body {
      display: none;
    }
    #main-panel.collapsed .panel-header {
      padding: 8px;
      border-bottom: none;
      justify-content: center;
      background: none;
    }
    #main-panel.collapsed .header-text {
      display: none;
    }
    #main-panel.collapsed .panel-toggle-btn {
      width: 40px;
      height: 40px;
      font-size: 28px;
      background: none;
      margin: 0;
    }
    .instruction {
      position: absolute;
      bottom: 30px;
      right: 30px;
      color: #aa9f7c;
      background: rgba(0,0,0,0.5);
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 0.8rem;
      border: 1px solid #5a4e3c;
      z-index: 10;
    }
    @media (max-width: 700px) {
      #main-panel {
        top: 10px;
        left: 10px;
        border-radius: 16px;
        min-width: 140px;
      }
      .header-text h1 {
        font-size: 1.1rem;
      }
      .header-text p {
        font-size: 0.65rem;
      }
      .toggle-btn {
        padding: 4px 10px;
        font-size: 0.75rem;
      }
      #main-panel.collapsed {
        border-radius: 50%;
      }
    }
  </style>
</head>
<body>
  <div id="main-panel">
    <div class="panel-header" id="panel-header">
      <div class="header-text">
        <h1>☯ 阴阳 · 四象 · 五行 · 八卦</h1>
        <p>太极生两仪 · 两仪生四象 · 四象生八卦 · 八卦定乾坤</p>
      </div>
      <button class="panel-toggle-btn" id="panel-toggle-btn" title="最小化">−</button>
    </div>
    <div class="panel-body">
      <button class="toggle-btn active" data-key="taiji">太 极</button>
      <button class="toggle-btn active" data-key="liangyi">两 仪</button>
      <button class="toggle-btn active" data-key="sixiang">四 象</button>
      <button class="toggle-btn active" data-key="wuxing">五 行</button>
      <button class="toggle-btn active" data-key="bagua">八 卦</button>
    </div>
  </div>

  <div class="instruction">鼠标拖动旋转视角 | 滚轮缩放 | 右键平移</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ---------- 场景初始化 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1a);

    // 星空
    const starsGeo = new THREE.BufferGeometry();
    const starsPos = new Float32Array(800 * 3);
    for (let i = 0; i < starsPos.length; i += 3) {
      starsPos[i] = (Math.random() - 0.5) * 60;
      starsPos[i+1] = (Math.random() - 0.5) * 35;
      starsPos[i+2] = (Math.random() - 0.5) * 40;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
    const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({color: 0xc0b78a, size: 0.08, blending: THREE.AdditiveBlending}));
    scene.add(stars);

    // 光照
    scene.add(new THREE.AmbientLight(0x404066));
    const dir1 = new THREE.DirectionalLight(0xffeedd, 0.9);
    dir1.position.set(1, 1, 1);
    scene.add(dir1);
    const dir2 = new THREE.DirectionalLight(0xccddff, 0.7);
    dir2.position.set(-0.8, -0.5, -1);
    scene.add(dir2);

    // 相机与渲染器
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 80);
    camera.position.set(5, 2.8, 7.5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.setClearColor(0x0a0f1a);
    document.body.appendChild(renderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.left = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.2, 0);
    controls.update();
    controls.minDistance = 3.5;
    controls.maxDistance = 18;

    // 地面网格
    scene.add(new THREE.PolarGridHelper(5.5, 32, 24, 64, 0x334455, 0x223344).translateY(-2.2));

    // ---------- 分组与标签存储 ----------
    const groups = {
      taiji: { group: new THREE.Group(), labels: [] },
      liangyi: { group: new THREE.Group(), labels: [] },
      sixiang: { group: new THREE.Group(), labels: [] },
      wuxing: { group: new THREE.Group(), labels: [] },
      bagua: { group: new THREE.Group(), labels: [] }
    };

    const R = 1.4;
    const r = R / 2;
    const eyeR = r * 0.4;
    const depth = 0.15;

    // ---------- 太极环 ----------
    const taijiRing = new THREE.Mesh(
      new THREE.TorusGeometry(R, 0.05, 16, 96),
      new THREE.MeshStandardMaterial({ color: 0xccaa55, roughness: 0.3, metalness: 0.7 })
    );
    taijiRing.rotation.x = Math.PI / 2;
    taijiRing.position.y = depth/2;
    groups.taiji.group.add(taijiRing);
    
    const taijiLabelDiv = document.createElement('div');
    taijiLabelDiv.textContent = '☯ 太极';
    taijiLabelDiv.style.cssText = 'color:#dac07b; font-weight:bold; font-size:18px; text-shadow:1px 1px 3px black;';
    const taijiLabel = new CSS2DObject(taijiLabelDiv);
    taijiLabel.position.set(0, 1.7, 0);
    groups.taiji.group.add(taijiLabel);
    groups.taiji.labels.push(taijiLabel);
    groups.taiji.group.position.set(0, -0.1, 0);
    scene.add(groups.taiji.group);

    // ---------- 两仪 ----------
    const blackShape = new THREE.Shape();
    blackShape.absarc(0, 0, R, -Math.PI/2, Math.PI/2, true);
    blackShape.absarc(0, r, r, Math.PI/2, -Math.PI/2, false);
    blackShape.absarc(0, -r, r, Math.PI/2, -Math.PI/2, true);
    const whiteShape = new THREE.Shape();
    whiteShape.absarc(0, 0, R, 0, Math.PI*2, false);
    whiteShape.holes.push(blackShape);
    const extrudeSettings = { depth: depth, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 3 };
    const whiteGeometry = new THREE.ExtrudeGeometry(whiteShape, extrudeSettings);
    const whiteMaterial = new THREE.MeshStandardMaterial({ color: 0xf5f0e6, roughness: 0.35, metalness: 0.2, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    const whiteMesh = new THREE.Mesh(whiteGeometry, whiteMaterial);
    whiteMesh.rotation.x = -Math.PI / 2;
    whiteMesh.position.y = -depth/2;
    groups.liangyi.group.add(whiteMesh);
    const blackGeometry = new THREE.ExtrudeGeometry(blackShape, extrudeSettings);
    const blackMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.3, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
    const blackMesh = new THREE.Mesh(blackGeometry, blackMaterial);
    blackMesh.rotation.x = -Math.PI / 2;
    blackMesh.position.y = -depth/2;
    groups.liangyi.group.add(blackMesh);
    const eyeBlack = new THREE.Mesh(new THREE.SphereGeometry(eyeR, 32, 32), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.4 }));
    eyeBlack.position.set(0, depth/2 + 0.01, -r);
    groups.liangyi.group.add(eyeBlack);
    const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(eyeR, 32, 32), new THREE.MeshStandardMaterial({ color: 0xf0e8d8, roughness: 0.25, metalness: 0.1 }));
    eyeWhite.position.set(0, depth/2 + 0.01, r);
    groups.liangyi.group.add(eyeWhite);
    groups.liangyi.group.position.set(0, -0.1, 0);
    scene.add(groups.liangyi.group);

    // ---------- 四象 ----------
    const sxDist = 2.15;
    const fourSymbols = [
      { name: '太阳', uni: '⚌', angle: 0, color: '#ffdd99' },
      { name: '少阴', uni: '⚎', angle: Math.PI/2, color: '#ccddff' },
      { name: '少阳', uni: '⚍', angle: Math.PI, color: '#ccddff' },
      { name: '太阴', uni: '⚏', angle: 3*Math.PI/2, color: '#ffdd99' }
    ];
    fourSymbols.forEach(s => {
      const x = Math.cos(s.angle) * sxDist;
      const z = Math.sin(s.angle) * sxDist;
      const platform = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.06, 24), new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.5, metalness: 0.4, transparent: true, opacity: 0.6 }));
      platform.position.set(x, 0.05, z);
      groups.sixiang.group.add(platform);
      const div = document.createElement('div');
      div.textContent = s.uni;
      div.style.cssText = `font-size:30px; color:${s.color}; text-shadow:0 0 10px currentColor; background:rgba(0,0,0,0.5); border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center;`;
      const label = new CSS2DObject(div);
      label.position.set(x, 0.32, z);
      groups.sixiang.group.add(label);
      groups.sixiang.labels.push(label);
      const nameDiv = document.createElement('div');
      nameDiv.textContent = s.name;
      nameDiv.style.cssText = 'font-size:14px; color:#ccbb99; background:rgba(0,0,0,0.6); padding:2px 8px; border-radius:10px;';
      const nameLabel = new CSS2DObject(nameDiv);
      nameLabel.position.set(x, -0.2, z);
      groups.sixiang.group.add(nameLabel);
      groups.sixiang.labels.push(nameLabel);
    });
    groups.sixiang.group.position.set(0, 0.1, 0);
    scene.add(groups.sixiang.group);

    // ---------- 五行 ----------
    const elements = [
      { name: '金', color: 0xd4af37, angle: Math.PI/2 },
      { name: '木', color: 0x5a8f5a, angle: Math.PI/2 + 2*Math.PI/5 },
      { name: '水', color: 0x4a6c8f, angle: Math.PI/2 + 4*Math.PI/5 },
      { name: '火', color: 0xc45a3c, angle: Math.PI/2 + 6*Math.PI/5 },
      { name: '土', color: 0xb59a5e, angle: Math.PI/2 + 8*Math.PI/5 }
    ];
    const elemDist = 2.7;
    elements.forEach(el => {
      const x = Math.cos(el.angle) * elemDist;
      const z = Math.sin(el.angle) * elemDist;
      const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.32, 32, 32), new THREE.MeshStandardMaterial({ color: el.color, roughness: 0.25, metalness: 0.45 }));
      sphere.position.set(x, 0.25, z);
      groups.wuxing.group.add(sphere);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.04, 8, 24), new THREE.MeshStandardMaterial({ color: el.color, roughness: 0.4, metalness: 0.6 }));
      ring.position.set(x, 0.25, z);
      ring.rotation.x = Math.PI/2;
      groups.wuxing.group.add(ring);
      const div = document.createElement('div');
      div.textContent = el.name;
      div.style.cssText = 'color:#f0e6c5; font-size:20px; font-weight:600; background:rgba(20,18,30,0.8); padding:2px 12px; border-radius:20px; border:1px solid ' + new THREE.Color(el.color).getStyle();
      const label = new CSS2DObject(div);
      label.position.set(x, 0.85, z);
      groups.wuxing.group.add(label);
      groups.wuxing.labels.push(label);
    });
    const angles = elements.map(e => e.angle);
    for (let i = 0; i < 5; i++) {
      const next = (i + 1) % 5;
      let a1 = angles[i], a2 = angles[next];
      if (a2 < a1) a2 += Math.PI * 2;
      const pts = [];
      for (let j = 0; j <= 40; j++) {
        const a = a1 + (j/40) * (a2 - a1);
        pts.push(new THREE.Vector3(Math.cos(a)*elemDist, 0.25, Math.sin(a)*elemDist));
      }
      const curve = new THREE.CatmullRomCurve3(pts);
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.025, 6, false), new THREE.MeshStandardMaterial({ color: elements[next].color, roughness: 0.5, metalness: 0.3 }));
      groups.wuxing.group.add(tube);
    }
    groups.wuxing.group.position.set(0, 0, 0);
    scene.add(groups.wuxing.group);

    // ---------- 八卦 ----------
    const trigrams = [
      { name: '乾', uni: '☰', angle: 0, color: 0xd4af37 },
      { name: '兑', uni: '☱', angle: Math.PI/4, color: 0xd4af37 },
      { name: '离', uni: '☲', angle: Math.PI/2, color: 0xc45a3c },
      { name: '震', uni: '☳', angle: 3*Math.PI/4, color: 0x5a8f5a },
      { name: '巽', uni: '☴', angle: Math.PI, color: 0x5a8f5a },
      { name: '坎', uni: '☵', angle: 5*Math.PI/4, color: 0x4a6c8f },
      { name: '艮', uni: '☶', angle: 3*Math.PI/2, color: 0xb59a5e },
      { name: '坤', uni: '☷', angle: 7*Math.PI/4, color: 0xb59a5e }
    ];
    const baguaR = 4.2;
    trigrams.forEach(t => {
      const x = Math.cos(t.angle) * baguaR;
      const z = Math.sin(t.angle) * baguaR;
      const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.08, 24), new THREE.MeshStandardMaterial({ color: 0x2a2a35, roughness: 0.5, metalness: 0.6 }));
      plate.position.set(x, 0.05, z);
      groups.bagua.group.add(plate);
      const div = document.createElement('div');
      div.textContent = t.uni;
      div.style.cssText = 'font-size:28px; font-weight:bold; color:#e5d7b3; text-shadow:0 0 12px currentColor; background:rgba(20,18,32,0.75); border-radius:8px; padding:2px 8px;';
      const label = new CSS2DObject(div);
      label.position.set(x, 0.32, z);
      groups.bagua.group.add(label);
      groups.bagua.labels.push(label);
      const nameDiv = document.createElement('div');
      nameDiv.textContent = t.name;
      nameDiv.style.cssText = 'font-size:16px; color:#ccbb99; background:rgba(0,0,0,0.7); padding:2px 10px; border-radius:12px; font-weight:bold;';
      const nameLabel = new CSS2DObject(nameDiv);
      nameLabel.position.set(x, -0.35, z);
      groups.bagua.group.add(nameLabel);
      groups.bagua.labels.push(nameLabel);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.43, 0.03, 8, 20), new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.35, metalness: 0.65 }));
      ring.position.set(x, 0.05, z);
      ring.rotation.x = Math.PI/2;
      groups.bagua.group.add(ring);
    });
    const outerBaguaRing = new THREE.Mesh(new THREE.TorusGeometry(baguaR, 0.05, 16, 96), new THREE.MeshStandardMaterial({ color: 0x998855, roughness: 0.4, metalness: 0.7 }));
    outerBaguaRing.rotation.x = Math.PI/2;
    outerBaguaRing.position.y = 0.05;
    groups.bagua.group.add(outerBaguaRing);
    groups.bagua.group.position.set(0, 0.1, 0);
    scene.add(groups.bagua.group);

    // 流动粒子
    const flowGeo = new THREE.BufferGeometry();
    const flowPos = new Float32Array(200 * 3);
    for (let i = 0; i < flowPos.length; i += 3) {
      const a = Math.random() * Math.PI * 2;
      const rad = baguaR + 0.15;
      flowPos[i] = Math.cos(a) * rad;
      flowPos[i+1] = 0.1 + Math.random() * 0.3;
      flowPos[i+2] = Math.sin(a) * rad;
    }
    flowGeo.setAttribute('position', new THREE.BufferAttribute(flowPos, 3));
    const flowParticles = new THREE.Points(flowGeo, new THREE.PointsMaterial({ color: 0xccaa66, size: 0.06, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.7 }));
    scene.add(flowParticles);

    // ---------- 按钮交互 ----------
    const toggleButtons = document.querySelectorAll('.toggle-btn');
    const stateMap = {
      taiji: true,
      liangyi: true,
      sixiang: true,
      wuxing: true,
      bagua: true
    };

    function setVisibility(key, visible) {
      const g = groups[key];
      g.group.visible = visible;
      g.labels.forEach(l => l.visible = visible);
    }

    toggleButtons.forEach(btn => {
      const key = btn.dataset.key;
      btn.addEventListener('click', () => {
        stateMap[key] = !stateMap[key];
        btn.classList.toggle('active', stateMap[key]);
        setVisibility(key, stateMap[key]);
      });
    });

    // ---------- 面板折叠 ----------
    const mainPanel = document.getElementById('main-panel');
    const toggleBtn = document.getElementById('panel-toggle-btn');
    
    toggleBtn.addEventListener('click', () => {
      mainPanel.classList.toggle('collapsed');
      toggleBtn.textContent = mainPanel.classList.contains('collapsed') ? '☯' : '−';
    });

    function autoCollapse() {
      if (window.innerWidth <= 700) {
        mainPanel.classList.add('collapsed');
        toggleBtn.textContent = '☯';
      } else {
        mainPanel.classList.remove('collapsed');
        toggleBtn.textContent = '−';
      }
    }
    window.addEventListener('resize', autoCollapse);
    autoCollapse();

    // ---------- 动画循环 ----------
    function animate() {
      requestAnimationFrame(animate);
      stars.rotation.y += 0.0001;
      groups.taiji.group.rotation.y += 0.003;
      groups.liangyi.group.rotation.y += 0.003;
      groups.sixiang.group.rotation.y -= 0.0015;
      groups.bagua.group.rotation.y -= 0.0008;
      flowParticles.rotation.y += 0.003;
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
