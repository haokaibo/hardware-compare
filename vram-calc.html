<!DOCTYPE html>
<html lang="zh-CN" class="i18n-ready">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM 显存计算器 - VRAM Calculator</title>
<meta name="description" content="根据模型参数量、精度与使用场景估算 LLM 推理/训练所需 GPU 显存。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/vram-calc.css">
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <div class="nav-logo">Hardware.ai</div>
        <div class="nav-links">
            <a href="index.html" data-i18n="nav.gpu-matrix">GPU 矩阵</a>
            <a href="bandwidth_ladder.html" data-i18n="nav.bw-ladder">带宽阶梯</a>
            <a href="vram-calc.html" class="active" data-i18n="nav.vram-calc">显存计算器</a>
            <a href="motherboard_upgrade_calculator.html" data-i18n="nav.mobo-calc">换板计算</a>
            <a href="red_one.html" data-i18n="nav.red-one">RED ONE</a>
        </div>
    </div>
</nav>

  <!-- ===== Main Content ===== -->
  <main>

    <!-- Hero -->
    <section class="hero">
      <h1 data-i18n="vram.hero-title">LLM 显存计算器 <span class="moe-badge" style="font-size: 13px;">v1.0</span></h1>
      <p data-i18n="vram.hero-desc">根据模型参数量、精度与使用场景，估算运行 LLM 所需的 GPU 显存</p>
    </section>

    <!-- Calculator -->
    <div class="calc-container">

      <!-- Left: Input Panel -->
      <div class="input-panel">
        <h2 data-i18n="vram.input-title">参数设置</h2>

        <!-- Preset -->
        <div class="form-group">
          <label data-i18n="vram.preset">模型预设</label>
          <select id="modelPreset">
            <option value="" disabled>加载中...</option>
          </select>
        </div>

        <!-- Parameters -->
        <div class="form-group">
          <label data-i18n="vram.params">模型参数量 <span class="unit">(Billion)</span></label>
          <div class="input-with-controls">
            <button id="paramDec" type="button" aria-label="减">−</button>
            <input type="number" id="paramCount" value="7" min="0.1" max="10000" step="1">
            <button id="paramInc" type="button" aria-label="加">+</button>
          </div>
        </div>

        <!-- MoE active params -->
        <div class="form-group" id="moeOptions" style="display:none;">
          <label data-i18n="vram.active-params">活跃参数量 <span class="unit">(B, MoE 模型)</span></label>
          <input type="number" id="activeParams" value="0" min="0" step="1">
        </div>

        <!-- Precision -->
        <div class="form-group">
          <label data-i18n="vram.precision">权重精度</label>
          <div class="btn-group" id="precisionGroup">
            <button type="button" data-value="fp32" class="btn-option">FP32</button>
            <button type="button" data-value="fp16" class="btn-option active">BF16 / FP16</button>
            <button type="button" data-value="fp8" class="btn-option">FP8</button>
            <button type="button" data-value="int4" class="btn-option">INT4 / NF4</button>
          </div>
        </div>

        <!-- Use Case -->
        <div class="form-group">
          <label data-i18n="vram.scenario">使用场景</label>
          <div class="btn-group" id="modeGroup">
            <button type="button" data-value="inference" class="btn-option active" data-i18n="vram.inference">推理</button>
            <button type="button" data-value="train" class="btn-option" data-i18n="vram.full-train">完整训练</button>
            <button type="button" data-value="lora" class="btn-option" data-i18n="vram.lora">LoRA 微调</button>
          </div>
        </div>

        <!-- Context + Batch -->
        <div class="form-group row">
          <div class="half">
            <label data-i18n="vram.context">上下文长度 <span class="unit">(tokens)</span></label>
            <input type="number" id="contextLen" value="8192" min="1" step="512">
          </div>
          <div class="half">
            <label data-i18n="vram.batch">Batch Size</label>
            <input type="number" id="batchSize" value="1" min="1" step="1">
          </div>
        </div>

        <!-- Advanced Settings -->
        <details class="advanced-section">
          <summary data-i18n="vram.advanced">高级设置</summary>
          <div class="form-group row">
            <div class="half">
              <label data-i18n="vram.layers">层数 <span class="unit">(Layers)</span></label>
              <input type="number" id="numLayers" value="32" min="1" step="1">
            </div>
            <div class="half">
              <label data-i18n="vram.hidden-dim">隐藏维度 <span class="unit">(Hidden Dim)</span></label>
              <input type="number" id="hiddenDim" value="4096" min="64" step="64">
            </div>
          </div>
          <!-- Activation Checkpointing (hidden by default, shown in training mode) -->
          <div class="form-group" id="activationOptions" style="display:none;">
            <label class="checkbox-label">
              <input type="checkbox" id="activationCheckpoint" checked>
              <span data-i18n="vram.activation-checkpoint">启用激活检查点 (Activation Checkpointing)</span>
            </label>
            <span class="hint" style="padding-left: 24px;" data-i18n="vram.activation-hint">大幅减少训练时的激活值显存，但会略微降低训练速度</span>
          </div>
        </details>

        <div style="margin-top: 8px; font-size: 12px; color: var(--text-muted);">
          💡 选择预设后自动填充架构参数，也可展开「高级设置」手动调整
        </div>
      </div>

      <!-- Right: Results Panel -->
      <div class="result-panel" id="resultPanel">
        <h2 data-i18n="vram.result-title">计算结果</h2>

        <!-- Total VRAM Card -->
        <div class="total-vram-card">
          <div class="total-label" data-i18n="vram.total-vram">所需 GPU 显存</div>
          <div id="totalVram" class="total-value">-- <span class="unit-text">GiB</span></div>
          <div class="total-bar-container">
            <div class="total-bar-labels">
              <span>0 GiB</span>
              <span>---</span>
            </div>
            <div class="total-bar">
              <div id="totalBarFill" class="bar-fill" style="width:0%"></div>
            </div>
            <div class="total-bar-ticks"></div>
          </div>
        </div>

        <!-- Breakdown -->
        <div class="breakdown-section">
          <h3 data-i18n="vram.breakdown">显存构成</h3>
          <div id="breakdownList" class="breakdown-list">
            <div class="result-empty">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="3" width="20" height="18" rx="2"/>
                <line x1="8" y1="9" x2="16" y2="9"/>
                <line x1="8" y1="13" x2="12" y2="13"/>
              </svg>
              <p data-i18n="vram.empty-result">调整参数后自动计算</p>
            </div>
          </div>
        </div>

        <!-- GPU Compatibility -->
        <div class="gpu-section">
          <h3 data-i18n="vram.compatible-gpus">兼容显卡</h3>
          <div id="gpuList" class="gpu-list">
            <div class="result-empty" style="padding: 30px 16px;">
              <p data-i18n="vram.waiting">等待输入参数…</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Detail Table -->
    <div class="detail-section">
      <h2 data-i18n="vram.details">计算明细</h2>
      <div id="detailTable">
        <div style="text-align:center; padding: 20px; color: var(--text-muted); font-size: 14px;" data-i18n="vram.details-hint">
          在左侧输入参数后将显示详细计算过程
        </div>
      </div>
    </div>

  </main>

  <script src="data/gpu-dataset.js"></script>
  <script src="scripts/vram-calc.js"></script>
  <script src="scripts/i18n.js"></script>
</body>
</html>
