name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the site actually changes.
    paths:
      - "index.html"
      - "favicon.svg"
      - "pages/**"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}   # lets you trigger a rebuild manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This project is plain static HTML/CSS/JS — no build step.
      # Stage only the files that belong to the published site so that
      # docs/tooling (README, tasks.md, .github, resources/) are not deployed.
      - name: Stage site files
        run: |
          mkdir -p dist
          cp -R index.html favicon.svg pages assets dist/
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
