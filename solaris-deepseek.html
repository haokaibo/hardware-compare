<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D太阳系行星模型 - 按钮式控制 | Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'SimHei', 'Segoe UI', 'PingFang SC', 'Roboto', sans-serif;
        }
        /* 整合的控制面板 - 默认展开状态，位于左上角 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background: rgba(10, 20, 40, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px;
            color: white;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 20;
            font-family: system-ui, 'Segoe UI', sans-serif;
            pointer-events: auto;
            transition: all 0.25s ease;
        }
        /* 最小化时的样式 - 变成圆形图标 */
        .control-panel.minimized {
            width: auto;
            padding: 8px;
            background: rgba(10, 20, 40, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 50px;
            cursor: pointer;
            border-color: rgba(255,200,100,0.6);
            box-shadow: 0 0 12px rgba(0,0,0,0.3);
        }
        .control-panel.minimized .panel-main,
        .control-panel.minimized .panel-header .minimize-btn {
            display: none;
        }
        .control-panel.minimized .panel-header {
            margin: 0;
            padding: 0;
            border: none;
        }
        .control-panel.minimized .panel-header h1 {
            display: none;
        }
        .panel-mini-logo {
            display: none;
        }
        .control-panel.minimized .panel-mini-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            width: 44px;
            height: 44px;
            background: rgba(255,200,100,0.2);
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .control-panel.minimized .panel-mini-logo:hover {
            transform: scale(1.05);
            background: rgba(255,200,100,0.3);
        }
        /* 标题区域 */
        .panel-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 12px;
            padding-bottom: 8px;
        }
        .panel-header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffcc88;
        }
        .minimize-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            padding: 0 6px;
            border-radius: 20px;
            transition: 0.2s;
            font-weight: bold;
        }
        .minimize-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .sub {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            margin-bottom: 10px;
        }
        /* 星球按钮网格布局 - 一行5个按钮 */
        .planet-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .planet-btn {
            background: rgba(30, 50, 80, 0.8);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 5px 0;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .planet-btn.visible {
            background: rgba(80, 140, 200, 0.9);
            border-color: #ffcc88;
            box-shadow: 0 0 4px rgba(255,200,100,0.5);
        }
        .planet-btn.hidden {
            background: rgba(40, 40, 60, 0.7);
            border-color: rgba(255,255,255,0.2);
            color: #aaa;
        }
        .planet-btn:hover {
            background: rgba(120, 160, 220, 0.9);
            transform: scale(1.02);
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 10px;
        }
        .ctrl-btn {
            background: rgba(30, 50, 80, 0.9);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 0;
            border-radius: 24px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
            text-align: center;
            backdrop-filter: blur(2px);
        }
        .ctrl-btn:hover {
            background: rgba(80, 120, 180, 0.9);
            border-color: #ffaa66;
        }
        .lang-btn {
            background: rgba(20, 60, 100, 0.9);
        }
        .footer-note {
            font-size: 10px;
            text-align: center;
            margin-top: 10px;
            opacity: 0.5;
            cursor: default;
        }
        /* 移动端适配 */
        @media (max-width: 700px) {
            .control-panel { width: 260px; top: 12px; left: 12px; padding: 10px; }
            .planet-btn { font-size: 10px; padding: 4px 0; }
            .ctrl-btn { font-size: 10px; }
            .panel-header h1 { font-size: 14px; }
        }
        .mini-hint {
            position: absolute;
            bottom: 12px;
            right: 12px;
            color: rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <!-- 整合后的控制面板 -->
    <div class="control-panel" id="controlPanel">
        <div class="panel-header">
            <h1 id="panel-title">🌌 3D 太阳系</h1>
            <button class="minimize-btn" id="minimizeBtn" title="最小化面板">−</button>
        </div>
        <div class="panel-main">
            <div class="sub" id="panel-subtitle">⚡ 速度 1/5 | 鼠标拖拽旋转/缩放</div>
            <!-- 星球按钮网格容器 -->
            <div class="planet-grid" id="planet-grid"></div>
            <div class="button-group">
                <div id="toggle-labels-btn" class="ctrl-btn">🏷️ 隐藏名称</div>
                <div id="lang-switch-btn" class="ctrl-btn lang-btn">🌐 English</div>
            </div>
            <div class="footer-note" id="panel-footer">✨ 点击按钮切换星球显隐</div>
        </div>
        <div class="panel-mini-logo" id="panelMiniLogo">🌌</div>
    </div>
    <div class="mini-hint">🪐 公转+自转 | 中英文切换</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.0003);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 30);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- 轨道控制器 ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.5;
        controls.zoomSpeed = 1.2;
        controls.panSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);
        controls.maxDistance = 65;
        controls.minDistance = 3;

        // --- 光照系统 ---
        const ambientLight = new THREE.AmbientLight(0x404060, 0.45);
        scene.add(ambientLight);
        
        const sunLight = new THREE.PointLight(0xffaa66, 1.5, 50);
        sunLight.position.set(0, 0, 0);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);
        
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
        fillLight.position.set(5, 10, 7);
        fillLight.castShadow = false;
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0x8866ff, 0.25);
        backLight.position.set(-3, 5, -5);
        scene.add(backLight);
        
        // --- 星空粒子系统 ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2500;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 400;
            starPositions[i*3+1] = (Math.random() - 0.5) * 200;
            starPositions[i*3+2] = (Math.random() - 0.5) * 150 - 50;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.7 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        const starGeometry2 = new THREE.BufferGeometry();
        const starCount2 = 4000;
        const starPositions2 = new Float32Array(starCount2 * 3);
        for (let i = 0; i < starCount2; i++) {
            starPositions2[i*3] = (Math.random() - 0.5) * 500;
            starPositions2[i*3+1] = (Math.random() - 0.5) * 300;
            starPositions2[i*3+2] = (Math.random() - 0.5) * 200 - 80;
        }
        starGeometry2.setAttribute('position', new THREE.BufferAttribute(starPositions2, 3));
        const starMaterial2 = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.12, transparent: true, opacity: 0.6 });
        const stars2 = new THREE.Points(starGeometry2, starMaterial2);
        scene.add(stars2);
        
        // --- 太阳 (无标签，自转，带光晕和粒子) ---
        const sunGeometry = new THREE.SphereGeometry(2.4, 128, 128);
        const sunMaterial = new THREE.MeshStandardMaterial({
            color: 0xffaa55,
            emissive: 0xff4422,
            emissiveIntensity: 0.9,
            metalness: 0.2,
            roughness: 0.5,
        });
        const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
        sunMesh.castShadow = false;
        sunMesh.receiveShadow = false;
        scene.add(sunMesh);
        
        const sunGlowGeometry = new THREE.SphereGeometry(2.65, 32, 32);
        const sunGlowMaterial = new THREE.MeshBasicMaterial({
            color: 0xff8844,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        const sunGlow = new THREE.Mesh(sunGlowGeometry, sunGlowMaterial);
        scene.add(sunGlow);
        
        const sunParticleCount = 800;
        const sunParticleGeo = new THREE.BufferGeometry();
        const sunPartPos = [];
        for (let i = 0; i < sunParticleCount; i++) {
            const rad = 2.8 + Math.random() * 0.7;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const x = rad * Math.sin(phi) * Math.cos(theta);
            const y = rad * Math.sin(phi) * Math.sin(theta);
            const z = rad * Math.cos(phi);
            sunPartPos.push(x, y, z);
        }
        sunParticleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(sunPartPos), 3));
        const sunGlowParticles = new THREE.Points(sunParticleGeo, new THREE.PointsMaterial({ color: 0xffaa66, size: 0.04, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending }));
        scene.add(sunGlowParticles);
        
        // --- 行星数据定义 (公转速度已调整为原始速度的1/5) ---
        const planetsData = [
            { name: '水星', color: 0xbc9a6c, radius: 0.28, distance: 4.2, speed: 0.0056, emissive: 0x332200, roughness: 0.7, metalness: 0.1 },
            { name: '金星', color: 0xe6b800, radius: 0.32, distance: 5.8, speed: 0.0040, emissive: 0x442200, roughness: 0.6, metalness: 0.1 },
            { name: '地球', color: 0x3a86ff, radius: 0.36, distance: 7.5, speed: 0.0034, emissive: 0x002244, roughness: 0.5, metalness: 0.2 },
            { name: '火星', color: 0xc45c2c, radius: 0.32, distance: 9.3, speed: 0.0028, emissive: 0x331100, roughness: 0.7, metalness: 0.15 },
            { name: '木星', color: 0xd8a27a, radius: 0.72, distance: 12.8, speed: 0.0016, emissive: 0x442200, roughness: 0.6, metalness: 0.25 },
            { name: '土星', color: 0xf0d9b0, radius: 0.65, distance: 15.5, speed: 0.0012, emissive: 0x442200, roughness: 0.5, metalness: 0.3, hasRing: true },
            { name: '天王星', color: 0xb0e0e6, radius: 0.52, distance: 18.5, speed: 0.0009, emissive: 0x114455, roughness: 0.5, metalness: 0.2 },
            { name: '海王星', color: 0x4a7db4, radius: 0.51, distance: 21.8, speed: 0.00072, emissive: 0x002244, roughness: 0.5, metalness: 0.2 }
        ];
        
        const planets = [];
        let earthMesh = null;
        
        // 存储所有可开关星球的对象 (太阳、行星、月球)
        const switchableObjects = [];  // 元素: { nameZh, mesh, type, extra, label, setVisible }
        // 存储所有标签对象 { nameZh, css2d, dom }
        const labelItems = [];
        
        // 辅助: 创建圆形轨道线
        function createOrbit(radius, color = 0x88aaff) {
            const points = [];
            const segments = 128;
            const angleStep = (Math.PI * 2) / segments;
            for (let i = 0; i <= segments; i++) {
                const angle = i * angleStep;
                const x = radius * Math.cos(angle);
                const z = radius * Math.sin(angle);
                points.push(new THREE.Vector3(x, 0, z));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.35 });
            const orbit = new THREE.LineLoop(geometry, material);
            scene.add(orbit);
        }
        
        // --- 创建简洁的土星环 (三个同心扁环) ---
        function createSimpleRings(planetRadius) {
            const ringGroup = new THREE.Group();
            const radii = [planetRadius * 1.25, planetRadius * 1.55, planetRadius * 1.85];
            const colors = [0xd4b87a, 0xcad2c5, 0xaac8e0];
            const opacities = [0.75, 0.65, 0.7];
            
            radii.forEach((r, idx) => {
                const ringGeo = new THREE.TorusGeometry(r, 0.045, 64, 300);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: colors[idx],
                    emissive: 0x331100,
                    emissiveIntensity: 0.08,
                    metalness: 0.5,
                    roughness: 0.4,
                    transparent: true,
                    opacity: opacities[idx]
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.4;
                ring.rotation.z = 0.2;
                ringGroup.add(ring);
            });
            const thinRingGeo = new THREE.TorusGeometry(planetRadius * 1.42, 0.03, 64, 300);
            const thinRingMat = new THREE.MeshStandardMaterial({
                color: 0xffeebb,
                metalness: 0.7,
                roughness: 0.2,
                transparent: true,
                opacity: 0.8
            });
            const thinRing = new THREE.Mesh(thinRingGeo, thinRingMat);
            thinRing.rotation.x = Math.PI / 2.4;
            thinRing.rotation.z = 0.18;
            ringGroup.add(thinRing);
            return ringGroup;
        }
        
        // --- 创建所有轨道和行星 ---
        planetsData.forEach((data, idx) => {
            const orbitColor = idx % 2 === 0 ? 0x77aaff : 0x88bbff;
            createOrbit(data.distance, orbitColor);
            
            const geometry = new THREE.SphereGeometry(data.radius, 96, 96);
            const material = new THREE.MeshStandardMaterial({
                color: data.color,
                emissive: data.emissive,
                emissiveIntensity: 0.08,
                roughness: data.roughness,
                metalness: data.metalness,
            });
            const planetMesh = new THREE.Mesh(geometry, material);
            planetMesh.castShadow = true;
            planetMesh.receiveShadow = false;
            planetMesh.userData = { speed: data.speed, angle: Math.random() * Math.PI * 2 };
            
            if (data.hasRing) {
                const ringGroup = createSimpleRings(data.radius);
                planetMesh.add(ringGroup);
                planetMesh.userData.ringGroup = ringGroup;
            }
            
            scene.add(planetMesh);
            
            // 创建CSS2D文字标签
            const div = document.createElement('div');
            div.textContent = data.name;
            div.style.color = '#f0f0f0';
            div.style.fontSize = '13px';
            div.style.fontWeight = '500';
            div.style.backgroundColor = 'rgba(20,20,40,0.7)';
            div.style.padding = '2px 10px';
            div.style.borderRadius = '20px';
            div.style.border = `1px solid ${new THREE.Color(data.color).getStyle()}`;
            div.style.backdropFilter = 'blur(4px)';
            div.style.pointerEvents = 'none';
            div.style.fontFamily = 'system-ui, "Segoe UI"';
            div.style.whiteSpace = 'nowrap';
            const label = new CSS2DObject(div);
            label.position.set(0, data.radius + 0.25, 0);
            planetMesh.add(label);
            
            labelItems.push({
                nameZh: data.name,
                css2d: label,
                dom: div
            });
            
            planets.push({
                mesh: planetMesh,
                distance: data.distance,
                speed: data.speed,
                angle: planetMesh.userData.angle,
                radius: data.radius,
                name: data.name,
                hasRing: data.hasRing || false,
                ringGroup: planetMesh.userData.ringGroup
            });
            
            if (data.name === '地球') {
                earthMesh = planetMesh;
            }
            
            switchableObjects.push({
                nameZh: data.name,
                mesh: planetMesh,
                type: 'planet',
                extra: null,
                label: label
            });
        });
        
        // --- 创建月球 ---
        const moonRadius = 0.11;
        const moonDistance = 1.15;
        const moonSpeed = 0.017;
        
        const moonGeometry = new THREE.SphereGeometry(moonRadius, 64, 64);
        const moonMaterial = new THREE.MeshStandardMaterial({
            color: 0xccccdd,
            emissive: 0x111122,
            emissiveIntensity: 0.05,
            roughness: 0.8,
            metalness: 0.05,
        });
        const moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
        moonMesh.castShadow = true;
        moonMesh.receiveShadow = false;
        scene.add(moonMesh);
        
        const moonDiv = document.createElement('div');
        moonDiv.textContent = '月球';
        moonDiv.style.color = '#ddddff';
        moonDiv.style.fontSize = '12px';
        moonDiv.style.fontWeight = '400';
        moonDiv.style.backgroundColor = 'rgba(0,0,0,0.6)';
        moonDiv.style.padding = '2px 8px';
        moonDiv.style.borderRadius = '16px';
        moonDiv.style.border = '1px solid #aaaaff';
        moonDiv.style.backdropFilter = 'blur(4px)';
        moonDiv.style.pointerEvents = 'none';
        moonDiv.style.whiteSpace = 'nowrap';
        const moonLabel = new CSS2DObject(moonDiv);
        moonLabel.position.set(0, moonRadius + 0.12, 0);
        moonMesh.add(moonLabel);
        
        labelItems.push({
            nameZh: '月球',
            css2d: moonLabel,
            dom: moonDiv
        });
        
        let moonAngle = Math.random() * Math.PI * 2;
        
        switchableObjects.push({
            nameZh: '月球',
            mesh: moonMesh,
            type: 'moon',
            extra: null,
            label: moonLabel
        });
        
        // --- 太阳添加到开关列表 ---
        switchableObjects.push({
            nameZh: '太阳',
            mesh: sunMesh,
            type: 'sun',
            extra: { glow: sunGlow, particles: sunGlowParticles },
            label: null
        });
        
        // --- 小行星带 (视觉效果) ---
        const asteroidCount = 2200;
        const asteroidGeometry = new THREE.BufferGeometry();
        const asteroidPositions = new Float32Array(asteroidCount * 3);
        for (let i = 0; i < asteroidCount; i++) {
            const r = 10.6 + Math.random() * 1.8;
            const angle = Math.random() * Math.PI * 2;
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            const y = (Math.random() - 0.5) * 0.9;
            asteroidPositions[i*3] = x;
            asteroidPositions[i*3+1] = y;
            asteroidPositions[i*3+2] = z;
        }
        asteroidGeometry.setAttribute('position', new THREE.BufferAttribute(asteroidPositions, 3));
        const asteroidMaterial = new THREE.PointsMaterial({ color: 0xaa9977, size: 0.055 });
        const asteroidField = new THREE.Points(asteroidGeometry, asteroidMaterial);
        scene.add(asteroidField);
        
        // --- 宇宙尘埃粒子 ---
        const dustGeo = new THREE.BufferGeometry();
        const dustCount = 1500;
        const dustPositions = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            dustPositions[i*3] = (Math.random() - 0.5) * 70;
            dustPositions[i*3+1] = (Math.random() - 0.5) * 30;
            dustPositions[i*3+2] = (Math.random() - 0.5) * 80;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({ color: 0x88aadd, size: 0.035, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending });
        const dustField = new THREE.Points(dustGeo, dustMat);
        scene.add(dustField);
        
        // 极淡的辅助轴线
        const axisHelper = new THREE.AxesHelper(14);
        axisHelper.material.transparent = true;
        axisHelper.material.opacity = 0.05;
        scene.add(axisHelper);
        
        // ==================== 中英文和标签控制逻辑 ====================
        let currentLang = 'zh';
        let labelsVisible = true;
        
        // 文本映射表
        const translations = {
            zh: {
                planetNames: {
                    '水星': '水星', '金星': '金星', '地球': '地球', '火星': '火星',
                    '木星': '木星', '土星': '土星', '天王星': '天王星', '海王星': '海王星',
                    '月球': '月球', '太阳': '太阳'
                },
                panelTitle: '🌌 3D 太阳系',
                panelSubtitle: '⚡ 速度 1/5 | 鼠标拖拽旋转/缩放',
                panelFooter: '✨ 点击按钮切换星球显隐',
                toggleLabelsBtnHide: '🏷️ 隐藏名称',
                toggleLabelsBtnShow: '🏷️ 显示名称',
                langBtnText: '🌐 English'
            },
            en: {
                planetNames: {
                    '水星': 'Mercury', '金星': 'Venus', '地球': 'Earth', '火星': 'Mars',
                    '木星': 'Jupiter', '土星': 'Saturn', '天王星': 'Uranus', '海王星': 'Neptune',
                    '月球': 'Moon', '太阳': 'Sun'
                },
                panelTitle: '🌌 3D Solar System',
                panelSubtitle: '⚡ Speed 1/5 | Drag to rotate/zoom',
                panelFooter: '✨ Click buttons to toggle planets',
                toggleLabelsBtnHide: '🏷️ Hide Labels',
                toggleLabelsBtnShow: '🏷️ Show Labels',
                langBtnText: '中文'
            }
        };
        
        // 更新3D场景中的标签文字
        function updateLabelsLanguage() {
            const t = translations[currentLang];
            labelItems.forEach(item => {
                const englishName = t.planetNames[item.nameZh];
                if (englishName) {
                    item.dom.textContent = englishName;
                } else {
                    item.dom.textContent = item.nameZh;
                }
            });
        }
        
        // 更新按钮上的文字
        function updateButtonNames() {
            const t = translations[currentLang];
            const btns = document.querySelectorAll('.planet-btn');
            const order = ['太阳', '水星', '金星', '地球', '火星', '木星', '土星', '天王星', '海王星', '月球'];
            btns.forEach((btn, idx) => {
                const zhName = order[idx];
                const text = t.planetNames[zhName];
                if (text) btn.textContent = text;
            });
        }
        
        // 更新UI面板文字
        function updateUILanguage() {
            const t = translations[currentLang];
            document.getElementById('panel-title').textContent = t.panelTitle;
            document.getElementById('panel-subtitle').textContent = t.panelSubtitle;
            document.getElementById('panel-footer').textContent = t.panelFooter;
            const toggleBtn = document.getElementById('toggle-labels-btn');
            toggleBtn.textContent = labelsVisible ? t.toggleLabelsBtnHide : t.toggleLabelsBtnShow;
            const langBtn = document.getElementById('lang-switch-btn');
            langBtn.textContent = t.langBtnText;
            updateButtonNames();
        }
        
        // 切换所有标签可见性
        function toggleLabelsVisibility() {
            labelsVisible = !labelsVisible;
            labelItems.forEach(item => {
                item.css2d.visible = labelsVisible;
            });
            const t = translations[currentLang];
            const toggleBtn = document.getElementById('toggle-labels-btn');
            toggleBtn.textContent = labelsVisible ? t.toggleLabelsBtnHide : t.toggleLabelsBtnShow;
        }
        
        // 切换语言
        function switchLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            updateLabelsLanguage();
            updateUILanguage();
        }
        
        // 绑定事件
        document.getElementById('toggle-labels-btn').addEventListener('click', toggleLabelsVisibility);
        document.getElementById('lang-switch-btn').addEventListener('click', switchLanguage);
        
        // 初始化语言
        updateLabelsLanguage();
        updateUILanguage();
        
        // ==================== 构建星球按钮网格 (一行5个，点按切换显隐) ====================
        const planetGrid = document.getElementById('planet-grid');
        const orderList = ['太阳', '水星', '金星', '地球', '火星', '木星', '土星', '天王星', '海王星', '月球'];
        
        // 存储每个按钮对应的对象引用和状态
        const planetButtons = [];
        
        orderList.forEach(name => {
            const obj = switchableObjects.find(o => o.nameZh === name);
            if (!obj) return;
            
            // 创建按钮
            const btn = document.createElement('button');
            btn.className = 'planet-btn visible';  // 默认可见状态
            btn.textContent = name;  // 初始中文
            
            // 获取对应标签（太阳没有标签）
            const cssLabel = labelItems.find(item => item.nameZh === name)?.css2d || null;
            
            // 更新按钮样式和星球显隐的函数
            const updateVisibility = (visible) => {
                obj.mesh.visible = visible;
                if (cssLabel) cssLabel.visible = visible;
                if (obj.type === 'sun' && obj.extra) {
                    obj.extra.glow.visible = visible;
                    obj.extra.particles.visible = visible;
                }
                // 更新按钮样式
                if (visible) {
                    btn.classList.remove('hidden');
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                    btn.classList.add('hidden');
                }
            };
            
            // 初始状态：全部可见
            updateVisibility(true);
            
            // 点击事件：切换状态
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const currentlyVisible = obj.mesh.visible;
                updateVisibility(!currentlyVisible);
            });
            
            planetGrid.appendChild(btn);
            planetButtons.push({ btn, obj, updateVisibility });
        });
        
        // 确保语言切换时按钮文字同步
        const originalUpdateButtonNames = updateButtonNames;
        window.updateButtonNames = updateButtonNames; // 备用
        
        // 重写 updateButtonNames 同时不影响原逻辑
        // 已经在上面定义，没问题
        
        // ==================== 面板最小化/最大化功能 ====================
        const panel = document.getElementById('controlPanel');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const miniLogo = document.getElementById('panelMiniLogo');
        
        function minimizePanel() {
            panel.classList.add('minimized');
        }
        
        function maximizePanel() {
            panel.classList.remove('minimized');
        }
        
        minimizeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            minimizePanel();
        });
        
        miniLogo.addEventListener('click', () => {
            maximizePanel();
        });
        
        // --- 动画变量 ---
        let time = 0;
        const planetRotationSpeed = 0.0024;
        const moonRotationSpeed = 0.003;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;
            
            // 太阳自转及附属
            if (sunMesh.visible) {
                sunMesh.rotation.y += 0.003;
                if (sunGlow.visible) sunGlow.rotation.y += 0.001;
                if (sunGlowParticles.visible) {
                    sunGlowParticles.rotation.y += 0.002;
                    sunGlowParticles.rotation.x += 0.001;
                }
            }
            
            // 行星公转及自转
            planets.forEach(planet => {
                planet.angle += planet.speed * 0.6;
                if (planet.angle > Math.PI * 2) planet.angle -= Math.PI * 2;
                const x = Math.cos(planet.angle) * planet.distance;
                const z = Math.sin(planet.angle) * planet.distance;
                planet.mesh.position.set(x, 0, z);
                if (planet.mesh.visible) {
                    planet.mesh.rotation.y += planetRotationSpeed;
                }
                if (planet.hasRing && planet.ringGroup && planet.mesh.visible) {
                    planet.ringGroup.rotation.y += 0.0015;
                    planet.ringGroup.rotation.x = Math.sin(time * 0.2) * 0.01;
                }
            });
            
            // 月球公转
            if (earthMesh) {
                moonAngle += moonSpeed * 0.6;
                if (moonAngle > Math.PI * 2) moonAngle -= Math.PI * 2;
                const offsetX = Math.cos(moonAngle) * moonDistance;
                const offsetZ = Math.sin(moonAngle) * moonDistance;
                moonMesh.position.x = earthMesh.position.x + offsetX;
                moonMesh.position.z = earthMesh.position.z + offsetZ;
                moonMesh.position.y = Math.sin(moonAngle * 2) * 0.05;
                if (moonMesh.visible) {
                    moonMesh.rotation.y += moonRotationSpeed;
                }
            }
            
            // 星空、小行星带动效
            asteroidField.rotation.y += 0.0015;
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            stars2.rotation.y -= 0.0002;
            dustField.rotation.y += 0.0006;
            dustField.rotation.x += 0.0003;
            
            const intensityVar = 1.4 + Math.sin(time * 3) * 0.08;
            sunLight.intensity = intensityVar;
            if (sunGlow.material) sunGlowMaterial.opacity = 0.18 + Math.sin(time * 2.5) * 0.05;
            
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        console.log('3D太阳系已启动 | 控制面板改为按钮式 | 一行5个按钮 | 点按切换显隐');
    </script>
</body>
</html>
