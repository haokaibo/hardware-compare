<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D太阳系 - 终极版（开源纹理全集） | Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(10, 20, 40, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px;
            color: white;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 20;
            pointer-events: auto;
            transition: all 0.25s ease;
        }
        .control-panel.minimized {
            width: auto; padding: 8px; border-radius: 50px; cursor: pointer;
        }
        .control-panel.minimized .panel-main, .control-panel.minimized .panel-header .minimize-btn { display: none; }
        .control-panel.minimized .panel-header { margin:0; padding:0; border:none; }
        .control-panel.minimized .panel-header h1 { display: none; }
        .panel-mini-logo { display: none; }
        .control-panel.minimized .panel-mini-logo {
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; width: 44px; height: 44px;
            background: rgba(255,200,100,0.2); border-radius: 50%;
        }
        .panel-header { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 12px; padding-bottom: 8px; }
        .panel-header h1 { margin:0; font-size:16px; color:#ffcc88; }
        .minimize-btn { background: rgba(255,255,255,0.15); border: none; color: white; cursor: pointer; border-radius: 20px; padding:0 6px; }
        .sub { font-size: 11px; opacity: 0.7; margin-bottom: 10px; }
        .planet-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
        .planet-btn {
            background: rgba(30,50,80,0.8); border: 1px solid rgba(255,255,255,0.3); color: white;
            padding: 5px 0; border-radius: 20px; font-size: 11px; cursor: pointer; text-align: center;
        }
        .planet-btn.visible { background: rgba(80,140,200,0.9); border-color: #ffcc88; }
        .planet-btn.hidden { background: rgba(40,40,60,0.7); color: #aaa; }
        .speed-control { margin: 8px 0; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.2); border-bottom: 1px solid rgba(255,255,255,0.2); }
        .speed-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; }
        input[type="range"] { width: 100%; cursor: pointer; background: rgba(30,50,80,0.8); height: 3px; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #ffcc88; }
        .button-group { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .ctrl-btn { background: rgba(30,50,80,0.9); border: 1px solid rgba(255,255,255,0.3); border-radius: 24px; padding: 6px 0; cursor: pointer; text-align: center; }
        .footer-note { font-size: 10px; text-align: center; margin-top: 10px; opacity: 0.5; }
        .mini-hint { position: absolute; bottom: 12px; right: 12px; color: rgba(255,255,255,0.4); background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 20px; font-size: 10px; pointer-events: none; }
        .loading-tip { position: absolute; bottom: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 24px; font-size: 12px; z-index: 100; pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body>
<div class="control-panel" id="controlPanel">
    <div class="panel-header">
        <h1 id="panel-title">🌌 3D 太阳系</h1>
        <button class="minimize-btn" id="minimizeBtn">−</button>
    </div>
    <div class="panel-main">
        <div class="sub" id="panel-subtitle">⚡ 速度可调 | 开源纹理全集</div>
        <div class="planet-grid" id="planet-grid"></div>
        <div class="speed-control">
            <div class="speed-label"><span>🚀 公转速度倍率</span><span class="speed-value" id="speedValue">1.00 x</span></div>
            <input type="range" id="speedSlider" min="0.1" max="2.0" step="0.01" value="1.0">
        </div>
        <div class="button-group">
            <div id="toggle-labels-btn" class="ctrl-btn">🏷️ 隐藏名称</div>
            <div id="lang-switch-btn" class="ctrl-btn lang-btn">🌐 English</div>
        </div>
        <div class="footer-note" id="panel-footer">✨ 点击按钮切换星球显隐</div>
    </div>
    <div class="panel-mini-logo" id="panelMiniLogo">🌌</div>
</div>
<div class="mini-hint">🪐 全开源纹理 | 盘状土星环 | 射线标签遮挡 | 轨道倾角</div>
<div id="loadingTip" class="loading-tip">加载纹理中...</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// --- 初始化场景、相机、渲染器 ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050b1a);
scene.fog = new THREE.FogExp2(0x050b1a, 0.0002);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 30);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0px';
labelRenderer.domElement.style.left = '0px';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.5; controls.zoomSpeed = 1.2;
controls.target.set(0, 0, 0); controls.maxDistance = 65; controls.minDistance = 3;

// 光照
const ambientLight = new THREE.AmbientLight(0x404060, 0.55);
scene.add(ambientLight);
const sunLight = new THREE.PointLight(0xffaa66, 1.8, 60);
sunLight.position.set(0, 0, 0);
sunLight.castShadow = true;
scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
fillLight.position.set(5, 10, 7);
scene.add(fillLight);
const backLight = new THREE.PointLight(0x8866ff, 0.25);
backLight.position.set(-3, 5, -5);
scene.add(backLight);

// 星空粒子
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 4000; i++) starPos.push((Math.random() - 0.5) * 600, (Math.random() - 0.5) * 400, (Math.random() - 0.5) * 300);
starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.7 }));
scene.add(stars);
const starGeo2 = new THREE.BufferGeometry();
const starPos2 = [];
for (let i = 0; i < 5000; i++) starPos2.push((Math.random() - 0.5) * 800, (Math.random() - 0.5) * 500, (Math.random() - 0.5) * 400);
starGeo2.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos2), 3));
const stars2 = new THREE.Points(starGeo2, new THREE.PointsMaterial({ color: 0xaaccff, size: 0.1, transparent: true, opacity: 0.5 }));
scene.add(stars2);

// 纹理加载管理器
const loadingTip = document.getElementById('loadingTip');
let loadedCount = 0;
const totalTextures = 22;
const texLoader = new THREE.TextureLoader();
function textureLoaded() { 
    loadedCount++; 
    if (loadedCount >= totalTextures - 4) { 
        loadingTip.style.opacity = '0'; 
        setTimeout(() => loadingTip.style.display = 'none', 500); 
    } 
}

// ========== 纹理配置 (全部使用开源 CDN) ==========
// 1. 太阳：开源高清纹理
const sunTextureUrl = 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/sunmap.jpg';
// 2. 地球：使用 Jerome Etienne 开源纹理
const earthMap = 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/earthmap1k.jpg';
const earthNormal = 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/earthbump1k.jpg';
// 地球云层（可选，原云层贴图可能没有开源版本，使用空白纹理或忽略）
const earthCloud = null; // 不再使用云层，避免加载失败
// 3. 月球：使用 Jerome Etienne 开源纹理
const moonMap = 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/moonmap1k.jpg';
// 4. 其他行星使用 CDN 纹理 (同样来自 Jerome Etienne 库)
const cdnTextures = {
  mercury: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/mercurymap.jpg', normal: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/mercurybump.jpg' },
  venus: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/venusmap.jpg', normal: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/venusbump.jpg' },
  mars: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/marsmap1k.jpg', normal: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/marsbump1k.jpg' },
  jupiter: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/jupitermap.jpg', normal: null },
  saturn: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/saturnmap.jpg', normal: null },
  uranus: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/uranusmap.jpg', normal: null },
  neptune: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/neptunemap.jpg', normal: null }
};

// 辅助函数
function loadCdnMaterial(mapUrl, normalUrl, color, roughness=0.6, metalness=0.1, emissive=0x000000, emissiveIntensity=0) {
    const material = new THREE.MeshStandardMaterial({ color, roughness, metalness, emissive, emissiveIntensity });
    if (mapUrl) texLoader.load(mapUrl, (t) => { material.map = t; material.needsUpdate = true; textureLoaded(); }, undefined, () => textureLoaded());
    else textureLoaded();
    if (normalUrl) texLoader.load(normalUrl, (t) => { material.normalMap = t; material.needsUpdate = true; textureLoaded(); }, undefined, () => textureLoaded());
    else textureLoaded();
    return material;
}
function loadEarthMaterial() {
    const material = new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.1, emissive: 0x001133, emissiveIntensity: 0.02 });
    texLoader.load(earthMap, (t) => { material.map = t; material.needsUpdate = true; textureLoaded(); });
    texLoader.load(earthNormal, (t) => { material.normalMap = t; material.needsUpdate = true; textureLoaded(); });
    return material;
}
function loadMoonMaterial() {
    const material = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.05, emissive: 0x111122, emissiveIntensity: 0.04 });
    texLoader.load(moonMap, (t) => { material.map = t; material.needsUpdate = true; textureLoaded(); });
    return material;
}

// --- 太阳 (开源纹理 + 自发光) ---
const sunGeometry = new THREE.SphereGeometry(2.4, 128, 128);
texLoader.crossOrigin = '';
const sunTexture = texLoader.load(sunTextureUrl, (texture) => { console.log('太阳纹理加载成功'); textureLoaded(); });
const sunMat = new THREE.MeshStandardMaterial({ 
    map: sunTexture,
    color: 0xffaa66,
    emissive: 0xff4422,
    emissiveIntensity: 1.3,
    metalness: 0.1,
    roughness: 0.4
});
const sunMesh = new THREE.Mesh(sunGeometry, sunMat);
sunMesh.castShadow = false;
scene.add(sunMesh);
// 太阳光晕和粒子
const sunGlowMat = new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.2, side: THREE.BackSide });
const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(2.68, 32, 32), sunGlowMat);
scene.add(sunGlow);
const sunParticles = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xffaa66, size: 0.04, blending: THREE.AdditiveBlending }));
const sunPartPos = [];
for (let i = 0; i < 800; i++) {
    const r = 2.8 + Math.random()*0.6, theta = Math.random()*Math.PI*2, phi = Math.acos(2*Math.random()-1);
    sunPartPos.push(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
}
sunParticles.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(sunPartPos), 3));
scene.add(sunParticles);

// 行星数据：半径(视觉放大比例)、距离、速度、倾角
const planetsData = [
    { name: '水星', radius: 0.28, distance: 4.2, speed: 0.0056, color: 0xbc9a6c, useCdn: true, cdnKey: 'mercury', roughness: 0.7, metalness: 0.15, emissive: 0x000000, emissiveIntensity: 0, inclination: (Math.random() - 0.5) * 0.08 },
    { name: '金星', radius: 0.32, distance: 5.8, speed: 0.0040, color: 0xe6b800, useCdn: true, cdnKey: 'venus', roughness: 0.6, metalness: 0.1, emissive: 0x331100, emissiveIntensity: 0.04, inclination: (Math.random() - 0.5) * 0.08 },
    { name: '地球', radius: 0.36, distance: 7.5, speed: 0.0034, color: 0x3a86ff, useCdn: false, roughness: 0.5, metalness: 0.1, emissive: 0x001133, emissiveIntensity: 0.02, cloud: false, inclination: (Math.random() - 0.5) * 0.08 },
    { name: '火星', radius: 0.34, distance: 9.3, speed: 0.0028, color: 0xc45c2c, useCdn: true, cdnKey: 'mars', roughness: 0.4, metalness: 0.2, emissive: 0x441100, emissiveIntensity: 0.07, inclination: (Math.random() - 0.5) * 0.08 },
    { name: '木星', radius: 1.2, distance: 12.8, speed: 0.0016, color: 0xd8a27a, useCdn: true, cdnKey: 'jupiter', roughness: 0.5, metalness: 0.35, emissive: 0x221100, emissiveIntensity: 0.03, inclination: (Math.random() - 0.5) * 0.06 },
    { name: '土星', radius: 1.1, distance: 15.5, speed: 0.0012, color: 0xf0d9b0, useCdn: true, cdnKey: 'saturn', roughness: 0.5, metalness: 0.3, emissive: 0x221100, emissiveIntensity: 0.03, hasRing: true, inclination: (Math.random() - 0.5) * 0.06 },
    { name: '天王星', radius: 0.8, distance: 18.5, speed: 0.0009, color: 0xb0e0e6, useCdn: true, cdnKey: 'uranus', roughness: 0.5, metalness: 0.2, emissive: 0x004455, emissiveIntensity: 0.04, inclination: (Math.random() - 0.5) * 0.06 },
    { name: '海王星', radius: 0.78, distance: 21.8, speed: 0.00072, color: 0x4a7db4, useCdn: true, cdnKey: 'neptune', roughness: 0.5, metalness: 0.2, emissive: 0x002244, emissiveIntensity: 0.05, inclination: (Math.random() - 0.5) * 0.06 }
];

const planets = [];
let earthMesh = null;
const switchableObjects = [];
const labelItems = [];

// 计算带倾角的位置
function getRotatedPosition(distance, angle, inclination) {
    const x0 = Math.cos(angle) * distance;
    const z0 = Math.sin(angle) * distance;
    const y0 = 0;
    const cos = Math.cos(inclination);
    const sin = Math.sin(inclination);
    const x = x0;
    const y = y0 * cos - z0 * sin;
    const z = y0 * sin + z0 * cos;
    return new THREE.Vector3(x, y, z);
}

// 创建带倾角的轨道线
function createOrbitWithInclination(radius, inclination, color = 0x88aaff) {
    const points = [];
    const segments = 200;
    for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        const x0 = Math.cos(angle) * radius;
        const z0 = Math.sin(angle) * radius;
        const y0 = 0;
        const cos = Math.cos(inclination);
        const sin = Math.sin(inclination);
        const x = x0;
        const y = y0 * cos - z0 * sin;
        const z = y0 * sin + z0 * cos;
        points.push(new THREE.Vector3(x, y, z));
    }
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.35 });
    const orbit = new THREE.LineLoop(geometry, material);
    scene.add(orbit);
}

// 土星环：使用 RingGeometry 实现薄盘状
function createSaturnRing(radius) {
    const ringGroup = new THREE.Group();
    const innerRadius = radius * 1.2;
    const outerRadius = radius * 1.85;
    const geometry = new THREE.RingGeometry(innerRadius, outerRadius, 64);
    const material = new THREE.MeshStandardMaterial({
        color: 0xcbb88e,
        emissive: 0x442200,
        emissiveIntensity: 0.1,
        roughness: 0.5,
        metalness: 0.4,
        transparent: true,
        opacity: 0.75,
        side: THREE.DoubleSide
    });
    const ring = new THREE.Mesh(geometry, material);
    ring.rotation.x = Math.PI / 2.2;
    ring.rotation.z = 0.2;
    ringGroup.add(ring);
    
    // 内环 (更亮)
    const innerRingGeo = new THREE.RingGeometry(radius * 1.05, radius * 1.18, 64);
    const innerMat = new THREE.MeshStandardMaterial({ color: 0xeeddbb, roughness: 0.4, metalness: 0.5, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
    const innerRing = new THREE.Mesh(innerRingGeo, innerMat);
    innerRing.rotation.x = Math.PI / 2.2;
    ringGroup.add(innerRing);
    
    return ringGroup;
}

planetsData.forEach((data, idx) => {
    createOrbitWithInclination(data.distance, data.inclination, idx % 2 === 0 ? 0x77aaff : 0x88bbff);
    
    let material;
    if (data.useCdn) {
        const cdn = cdnTextures[data.cdnKey];
        material = loadCdnMaterial(cdn.map, cdn.normal, data.color, data.roughness, data.metalness, data.emissive, data.emissiveIntensity);
    } else {
        material = loadEarthMaterial();
    }
    
    const planetMesh = new THREE.Mesh(new THREE.SphereGeometry(data.radius, 128, 128), material);
    planetMesh.castShadow = true;
    planetMesh.userData = { speed: data.speed, angle: Math.random() * Math.PI * 2, inclination: data.inclination };
    
    if (data.hasRing) {
        const ringGroup = createSaturnRing(data.radius);
        planetMesh.add(ringGroup);
        planetMesh.userData.ringGroup = ringGroup;
    }
    
    // 地球云层（已禁用，因为新纹理没有配套云层）
    // 火星大气
    if (data.name === '火星') {
        const atmosMat = new THREE.MeshPhongMaterial({ color: 0xcc6644, transparent: true, opacity: 0.07, side: THREE.BackSide });
        const atmos = new THREE.Mesh(new THREE.SphereGeometry(data.radius + 0.04, 64, 64), atmosMat);
        planetMesh.add(atmos);
    }
    
    scene.add(planetMesh);
    
    // CSS2D 标签
    const div = document.createElement('div');
    div.textContent = data.name;
    div.style.cssText = `color:#f0f0f0;font-size:13px;font-weight:500;background:rgba(20,20,40,0.7);padding:2px 10px;border-radius:20px;border:1px solid ${new THREE.Color(data.color).getStyle()};backdrop-filter:blur(4px);pointer-events:none;transition:opacity 0.2s`;
    const label = new CSS2DObject(div);
    label.position.set(0, data.radius + 0.3, 0);
    planetMesh.add(label);
    labelItems.push({ nameZh: data.name, css2d: label, dom: div });
    
    planets.push({
        mesh: planetMesh,
        distance: data.distance,
        baseSpeed: data.speed,
        angle: planetMesh.userData.angle,
        inclination: data.inclination,
        name: data.name,
        hasRing: data.hasRing,
        ringGroup: planetMesh.userData.ringGroup,
        label: label
    });
    if (data.name === '地球') earthMesh = planetMesh;
    switchableObjects.push({ nameZh: data.name, mesh: planetMesh, type: 'planet', extra: null, label });
});

// 月球 (使用开源纹理)
const moonMaterial = loadMoonMaterial();
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.11, 128, 128), moonMaterial);
moonMesh.castShadow = true;
scene.add(moonMesh);
const moonDiv = document.createElement('div');
moonDiv.textContent = '月球';
moonDiv.style.cssText = 'color:#ddddff;font-size:12px;background:rgba(0,0,0,0.6);padding:2px 8px;border-radius:16px;border:1px solid #aaaaff';
const moonLabel = new CSS2DObject(moonDiv);
moonLabel.position.set(0, 0.18, 0);
moonMesh.add(moonLabel);
labelItems.push({ nameZh: '月球', css2d: moonLabel, dom: moonDiv });
switchableObjects.push({ nameZh: '月球', mesh: moonMesh, type: 'moon', extra: null, label: moonLabel });
let moonAngle = Math.random() * Math.PI * 2;
const moonDistance = 1.15, moonBaseSpeed = 0.017;

// 太阳加入开关
switchableObjects.push({ nameZh: '太阳', mesh: sunMesh, type: 'sun', extra: { glow: sunGlow, particles: sunParticles }, label: null });

// 小行星带
const asteroidCount = 3000;
const asteroidGeo = new THREE.BufferGeometry();
const asteroidPos = [];
for (let i=0; i<asteroidCount; i++) {
    const r = 10.8 + Math.random() * 1.5;
    const angle = Math.random() * Math.PI * 2;
    asteroidPos.push(Math.cos(angle)*r, (Math.random()-0.5)*0.6, Math.sin(angle)*r);
}
asteroidGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(asteroidPos), 3));
const asteroidField = new THREE.Points(asteroidGeo, new THREE.PointsMaterial({ color: 0xaa9977, size: 0.045 }));
scene.add(asteroidField);
// 宇宙尘埃
const dustGeo = new THREE.BufferGeometry();
const dustPos = [];
for (let i=0; i<2500; i++) dustPos.push((Math.random()-0.5)*90, (Math.random()-0.5)*50, (Math.random()-0.5)*120);
dustGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(dustPos), 3));
const dustField = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x88aadd, size: 0.03, transparent: true, opacity: 0.25 }));
scene.add(dustField);
// 辅助轴线
const axesHelper = new THREE.AxesHelper(14);
axesHelper.material.transparent = true;
axesHelper.material.opacity = 0.03;
scene.add(axesHelper);

// ========== 射线检测：标签遮挡太阳 ==========
const raycaster = new THREE.Raycaster();
function updateLabelsOcclusion() {
    const cameraPos = camera.position;
    planets.forEach(planet => {
        const planetPos = planet.mesh.position;
        const direction = new THREE.Vector3().subVectors(planetPos, cameraPos).normalize();
        raycaster.set(cameraPos, direction);
        const intersects = raycaster.intersectObject(sunMesh);
        let occluded = false;
        if (intersects.length > 0) {
            const hitPoint = intersects[0].point;
            const distToPlanet = cameraPos.distanceTo(planetPos);
            const distToHit = cameraPos.distanceTo(hitPoint);
            if (distToHit < distToPlanet - 0.5) occluded = true;
        }
        if (planet.label) planet.label.element.style.opacity = occluded ? '0' : '1';
    });
    const moonPos = moonMesh.position;
    const moonDir = new THREE.Vector3().subVectors(moonPos, cameraPos).normalize();
    raycaster.set(cameraPos, moonDir);
    const moonIntersects = raycaster.intersectObject(sunMesh);
    let moonOccluded = false;
    if (moonIntersects.length > 0) {
        const hitPoint = moonIntersects[0].point;
        const distToMoon = cameraPos.distanceTo(moonPos);
        const distToHit = cameraPos.distanceTo(hitPoint);
        if (distToHit < distToMoon - 0.5) moonOccluded = true;
    }
    moonLabel.element.style.opacity = moonOccluded ? '0' : '1';
}

// ========== 速度控制 ==========
let speedFactor = 1.0;
const speedSlider = document.getElementById('speedSlider');
const speedValueSpan = document.getElementById('speedValue');
speedSlider.addEventListener('input', (e) => { 
    speedFactor = parseFloat(e.target.value); 
    speedValueSpan.textContent = speedFactor.toFixed(2) + ' x'; 
});

// ========== 中英文切换与标签控制 ==========
let currentLang = 'zh';
let labelsVisible = true;
const translations = {
    zh: { names: { '水星':'水星','金星':'金星','地球':'地球','火星':'火星','木星':'木星','土星':'土星','天王星':'天王星','海王星':'海王星','月球':'月球','太阳':'太阳' }, title:'🌌 3D 太阳系', subtitle:'⚡ 开源纹理全集 | 盘状星环', footer:'✨ 点击按钮切换显隐', hide:'🏷️ 隐藏名称', show:'🏷️ 显示名称', lang:'🌐 English' },
    en: { names: { '水星':'Mercury','金星':'Venus','地球':'Earth','火星':'Mars','木星':'Jupiter','土星':'Saturn','天王星':'Uranus','海王星':'Neptune','月球':'Moon','太阳':'Sun' }, title:'🌌 3D Solar System', subtitle:'⚡ Open Source Textures | Thin Rings', footer:'✨ Click to toggle', hide:'🏷️ Hide Labels', show:'🏷️ Show Labels', lang:'中文' }
};
function updateLang() {
    const t = translations[currentLang];
    labelItems.forEach(item => { item.dom.textContent = t.names[item.nameZh]; });
    document.getElementById('panel-title').textContent = t.title;
    document.getElementById('panel-subtitle').textContent = t.subtitle;
    document.getElementById('panel-footer').textContent = t.footer;
    const toggleBtn = document.getElementById('toggle-labels-btn');
    toggleBtn.textContent = labelsVisible ? t.hide : t.show;
    document.getElementById('lang-switch-btn').textContent = t.lang;
    const btns = document.querySelectorAll('.planet-btn');
    const order = ['太阳','水星','金星','地球','火星','木星','土星','天王星','海王星','月球'];
    btns.forEach((btn,i) => { btn.textContent = t.names[order[i]]; });
}
function toggleAllLabels() {
    labelsVisible = !labelsVisible;
    labelItems.forEach(item => item.css2d.visible = labelsVisible);
    const t = translations[currentLang];
    document.getElementById('toggle-labels-btn').textContent = labelsVisible ? t.hide : t.show;
}
function switchLang() { currentLang = currentLang === 'zh' ? 'en' : 'zh'; updateLang(); }
document.getElementById('toggle-labels-btn').addEventListener('click', toggleAllLabels);
document.getElementById('lang-switch-btn').addEventListener('click', switchLang);
updateLang();

// 按钮网格
const grid = document.getElementById('planet-grid');
const orderList = ['太阳','水星','金星','地球','火星','木星','土星','天王星','海王星','月球'];
orderList.forEach(name => {
    const obj = switchableObjects.find(o => o.nameZh === name);
    if (!obj) return;
    const btn = document.createElement('button');
    btn.className = 'planet-btn visible';
    btn.textContent = name;
    const label = labelItems.find(l => l.nameZh === name)?.css2d || null;
    const setVisible = (vis) => {
        obj.mesh.visible = vis;
        if (label) label.visible = vis;
        if (obj.type === 'sun' && obj.extra) {
            obj.extra.glow.visible = vis;
            obj.extra.particles.visible = vis;
        }
        btn.classList.toggle('visible', vis);
        btn.classList.toggle('hidden', !vis);
    };
    setVisible(true);
    btn.addEventListener('click', () => setVisible(!obj.mesh.visible));
    grid.appendChild(btn);
});

// 最小化面板
const panel = document.getElementById('controlPanel');
document.getElementById('minimizeBtn').addEventListener('click', () => panel.classList.add('minimized'));
document.getElementById('panelMiniLogo').addEventListener('click', () => panel.classList.remove('minimized'));

// ========== 动画循环 ==========
let time = 0;
const planetRotSpeed = 0.0024;
const moonRotSpeed = 0.003;
function animate() {
    requestAnimationFrame(animate);
    time += 0.008;
    if (sunMesh.visible) {
        sunMesh.rotation.y += 0.003;
        sunGlow.rotation.y += 0.001;
        sunParticles.rotation.y += 0.002;
    }
    // 行星公转：应用速度倍率和轨道倾角
    planets.forEach(p => {
        p.angle += p.baseSpeed * speedFactor * 0.6;
        if (p.angle > Math.PI*2) p.angle -= Math.PI*2;
        const pos = getRotatedPosition(p.distance, p.angle, p.inclination);
        p.mesh.position.copy(pos);
        if (p.mesh.visible) p.mesh.rotation.y += planetRotSpeed;
        if (p.hasRing && p.ringGroup && p.mesh.visible) p.ringGroup.rotation.y += 0.001;
    });
    // 月球公转
    if (earthMesh) {
        moonAngle += moonBaseSpeed * speedFactor * 0.6;
        if (moonAngle > Math.PI*2) moonAngle -= Math.PI*2;
        const offsetX = Math.cos(moonAngle) * moonDistance;
        const offsetZ = Math.sin(moonAngle) * moonDistance;
        moonMesh.position.set(earthMesh.position.x + offsetX, Math.sin(moonAngle*2)*0.05, earthMesh.position.z + offsetZ);
        if (moonMesh.visible) moonMesh.rotation.y += moonRotSpeed;
    }
    asteroidField.rotation.y += 0.001;
    stars.rotation.y += 0.0003;
    stars2.rotation.x += 0.0002;
    dustField.rotation.y += 0.0005;
    const intensity = 1.5 + Math.sin(time*3)*0.12;
    sunLight.intensity = intensity;
    sunGlow.material.opacity = 0.2 + Math.sin(time*2)*0.05;
    
    updateLabelsOcclusion();
    
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
setTimeout(() => { if(loadingTip.style.display !== 'none') loadingTip.style.display = 'none'; }, 5000);
