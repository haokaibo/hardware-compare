<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D太阳系 - 旗舰版 | 完全双语支持 | 增强纹理</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', sans-serif; }
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            background: rgba(10, 20, 40, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px;
            color: white;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 20;
            pointer-events: auto;
            transition: all 0.25s ease;
        }
        .control-panel.minimized { width: auto; padding: 8px; border-radius: 50px; cursor: pointer; }
        .control-panel.minimized .panel-main, .control-panel.minimized .panel-header .minimize-btn { display: none; }
        .control-panel.minimized .panel-header { margin:0; padding:0; border:none; }
        .control-panel.minimized .panel-header h1 { display: none; }
        .panel-mini-logo { display: none; }
        .control-panel.minimized .panel-mini-logo {
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; width: 44px; height: 44px;
            background: rgba(255,200,100,0.2); border-radius: 50%;
        }
        .panel-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 12px; padding-bottom: 8px; }
        .panel-header h1 { margin:0; font-size:16px; color:#ffcc88; }
        .header-buttons { display: flex; gap: 8px; }
        .header-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 12px;
            transition: 0.2s;
        }
        .header-btn:hover { background: rgba(255,255,255,0.3); }
        .minimize-btn { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 16px; line-height: 1; cursor: pointer; border-radius: 20px; padding: 0 8px; }
        .sub { font-size: 11px; opacity: 0.7; margin-bottom: 10px; }
        .planet-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
        .planet-btn {
            background: rgba(30,50,80,0.8); border: 1px solid rgba(255,255,255,0.3); color: white;
            padding: 5px 0; border-radius: 20px; font-size: 11px; cursor: pointer; text-align: center;
        }
        .planet-btn.visible { background: rgba(80,140,200,0.9); border-color: #ffcc88; }
        .planet-btn.hidden { background: rgba(40,40,60,0.7); color: #aaa; }
        .speed-control { margin: 8px 0; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.2); border-bottom: 1px solid rgba(255,255,255,0.2); }
        .speed-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; }
        input[type="range"] { width: 100%; cursor: pointer; background: rgba(30,50,80,0.8); height: 3px; -webkit-appearance: none; margin-bottom: 8px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #ffcc88; }
        .speed-value { background: rgba(0,0,0,0.5); padding: 0 6px; border-radius: 12px; font-size: 11px; }
        .button-group { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .ctrl-btn { background: rgba(30,50,80,0.9); border: 1px solid rgba(255,255,255,0.3); border-radius: 24px; padding: 6px 0; cursor: pointer; text-align: center; }
        .ctrl-btn:hover { background: rgba(80,120,180,0.9); border-color: #ffaa66; }
        .footer-note { font-size: 10px; text-align: center; margin-top: 10px; opacity: 0.5; }
        .mini-hint { position: absolute; bottom: 12px; right: 12px; color: rgba(255,255,255,0.4); background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 20px; font-size: 10px; pointer-events: none; z-index: 10; }
        .loading-tip { position: absolute; bottom: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 24px; font-size: 12px; z-index: 100; pointer-events: none; white-space: nowrap; }
        
        /* 信息面板 - 左下角 */
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 280px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 16px;
            color: #fff;
            font-size: 13px;
            border-left: 4px solid #ffaa66;
            pointer-events: auto;
            z-index: 25;
            transition: 0.3s;
            font-family: monospace;
        }
        .info-panel h4 { margin: 0 0 8px 0; color: #ffcc88; font-size: 16px; }
        .info-panel p { margin: 4px 0; line-height: 1.4; }
        .info-panel .close-info { position: absolute; top: 8px; right: 12px; cursor: pointer; font-size: 18px; opacity: 0.7; }
        .info-panel .close-info:hover { opacity: 1; }
        .reset-view-btn { background: rgba(30,50,80,0.9); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 5px 0; border-radius: 20px; cursor: pointer; text-align: center; margin-top: 8px; font-size: 11px; }
        .reset-view-btn:hover { background: rgba(80,120,180,0.9); }
    </style>
</head>
<body>
<div class="control-panel" id="controlPanel">
    <div class="panel-header">
        <h1 id="panel-title">🌌 3D 太阳系</h1>
        <div class="header-buttons">
            <button id="lang-switch-btn" class="header-btn">🌐 English</button>
            <button id="minimizeBtn" class="minimize-btn">−</button>
        </div>
    </div>
    <div class="panel-main">
        <div class="sub" id="panel-subtitle">⚡ 双速度调节 | 自动巡游模式</div>
        <div class="planet-grid" id="planet-grid"></div>
        <div class="speed-control">
            <div class="speed-label"><span id="orbit-speed-label">🚀 公转速度倍率</span><span class="speed-value" id="orbitSpeedValue">1.00 x</span></div>
            <input type="range" id="orbitSpeedSlider" min="0.1" max="2.0" step="0.01" value="1.0">
        </div>
        <div class="speed-control" style="border-top: none; margin-top: -4px;">
            <div class="speed-label"><span id="rotation-speed-label">🔄 自转速度倍率</span><span class="speed-value" id="rotationSpeedValue">1.00 x</span></div>
            <input type="range" id="rotationSpeedSlider" min="0.1" max="2.0" step="0.01" value="1.0">
        </div>
        <div class="button-group">
            <div id="toggle-labels-btn" class="ctrl-btn">🏷️ 隐藏名称</div>
            <div id="auto-tour-btn" class="ctrl-btn" style="background: rgba(80,100,130,0.9);">🔁 停止巡游</div>
        </div>
        <div class="footer-note" id="panel-footer">✨ 点击行星追踪/信息 | 自动巡游默认开启</div>
    </div>
    <div class="panel-mini-logo" id="panelMiniLogo">🌌</div>
</div>
<div class="mini-hint">🪐 自动巡游中(10秒/行星) | 点击行星可中断 | 再次点击按钮恢复</div>
<div id="loadingTip" class="loading-tip">加载纹理中...</div>

<div id="infoPanel" class="info-panel" style="display: none;">
    <span class="close-info" id="closeInfoBtn">&times;</span>
    <h4 id="infoName">行星名称</h4>
    <p id="infoRadius"><span id="radiusLabel">🌍 半径</span>: <span id="radiusValue">--</span> <span id="radiusUnit">km</span></p>
    <p id="infoDistance"><span id="distanceLabel">📡 距日距离</span>: <span id="distanceValue">--</span> <span id="distanceUnit">百万 km</span></p>
    <p id="infoOrbitPeriod"><span id="periodLabel">⏱️ 公转周期</span>: <span id="periodValue">--</span> <span id="periodUnit">地球日</span></p>
    <div id="resetViewBtn" class="reset-view-btn">🎥 重置全局视角</div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import TWEEN from 'https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js';

// --- 初始化场景、相机、渲染器 ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010118);
scene.fog = new THREE.FogExp2(0x010118, 0.0002);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 12, 30);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0px';
labelRenderer.domElement.style.left = '0px';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 1.2;
controls.panSpeed = 0.8;
controls.enableZoom = true;
controls.enablePan = true;
controls.target.set(0, 0, 0);
controls.maxDistance = 65;
controls.minDistance = 3;

// --- 光照系统 ---
const ambientLight = new THREE.AmbientLight(0x222222, 0.25);
scene.add(ambientLight);
const sunLight = new THREE.PointLight(0xffaa66, 2.8, 60);
sunLight.position.set(0, 0, 0);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
scene.add(sunLight);

// 星空粒子
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 4000; i++) starPos.push((Math.random() - 0.5) * 600, (Math.random() - 0.5) * 400, (Math.random() - 0.5) * 300);
starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.7 }));
scene.add(stars);
const starGeo2 = new THREE.BufferGeometry();
const starPos2 = [];
for (let i = 0; i < 5000; i++) starPos2.push((Math.random() - 0.5) * 800, (Math.random() - 0.5) * 500, (Math.random() - 0.5) * 400);
starGeo2.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos2), 3));
const stars2 = new THREE.Points(starGeo2, new THREE.PointsMaterial({ color: 0xaaccff, size: 0.1, transparent: true, opacity: 0.5 }));
scene.add(stars2);

// 纹理加载管理器
const loadingTip = document.getElementById('loadingTip');
let loadedCount = 0;
const totalTextures = 22;
const texLoader = new THREE.TextureLoader();
function textureLoaded() { 
    loadedCount++; 
    if (loadedCount >= totalTextures - 4) { 
        loadingTip.style.opacity = '0'; 
        setTimeout(() => loadingTip.style.display = 'none', 500); 
    } 
}

// ========== 纹理配置 ==========
const sunTextureUrl = 'https://upload.wikimedia.org/wikipedia/commons/c/cb/Solarsystemscope_texture_2k_sun.jpg';
const earthMap = 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/earthmap1k.jpg';
const earthNormal = 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/earthbump1k.jpg';
const moonMap = 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/moonmap1k.jpg';
const saturnMap = 'https://www.solarsystemscope.com/textures/download/2k_saturn.jpg';

const cdnTextures = {
  mercury: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/mercurymap.jpg', normal: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/mercurybump.jpg' },
  venus: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/venusmap.jpg', normal: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/venusbump.jpg' },
  mars: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/marsmap1k.jpg', normal: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/marsbump1k.jpg' },
  jupiter: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/jupitermap.jpg', normal: null },
  uranus: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/uranusmap.jpg', normal: null },
  neptune: { map: 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets@master/images/neptunemap.jpg', normal: null }
};

function loadCdnMaterial(mapUrl, normalUrl, color, roughness=0.6, metalness=0.1, emissive=0x000000, emissiveIntensity=0) {
    const material = new THREE.MeshStandardMaterial({ color, roughness, metalness, emissive, emissiveIntensity });
    if (mapUrl) texLoader.load(mapUrl, (t) => { material.map = t; material.needsUpdate = true; textureLoaded(); }, undefined, () => textureLoaded());
    else textureLoaded();
    if (normalUrl) texLoader.load(normalUrl, (t) => { material.normalMap = t; material.needsUpdate = true; textureLoaded(); }, undefined, () => textureLoaded());
    else textureLoaded();
    return material;
}
function loadEarthMaterial() {
    const material = new THREE.MeshStandardMaterial({ roughness: 0.5, metalness: 0.1, emissive: 0x001133, emissiveIntensity: 0.005 });
    texLoader.load(earthMap, (t) => { material.map = t; material.needsUpdate = true; textureLoaded(); });
    texLoader.load(earthNormal, (t) => { material.normalMap = t; material.needsUpdate = true; textureLoaded(); });
    return material;
}
function loadMoonMaterial() {
    const material = new THREE.MeshStandardMaterial({ roughness: 0.8, metalness: 0.05, emissive: 0x111122, emissiveIntensity: 0.02 });
    texLoader.load(moonMap, (t) => { material.map = t; material.needsUpdate = true; textureLoaded(); });
    return material;
}
function loadSaturnMaterial() {
    const material = new THREE.MeshStandardMaterial({
        roughness: 0.7,
        metalness: 0.1,
        emissive: 0x442200,
        emissiveIntensity: 0.06
    });
    texLoader.crossOrigin = "Anonymous";
    texLoader.load(saturnMap, (t) => { material.map = t; material.needsUpdate = true; textureLoaded(); }, undefined, () => textureLoaded());
    return material;
}

// --- 太阳 (核心优化: 自发光烈焰效果) ---
const sunGeometry = new THREE.SphereGeometry(2.4, 128, 128);
texLoader.crossOrigin = '';
const sunTexture = texLoader.load(sunTextureUrl, () => { console.log('太阳纹理加载成功'); textureLoaded(); });
const sunMat = new THREE.MeshStandardMaterial({
    map: sunTexture,
    color: 0xffaa66,
    emissive: 0xff6633,
    emissiveMap: sunTexture,
    emissiveIntensity: 0.9,
    metalness: 0.1,
    roughness: 0.4,
    toneMapped: false
});
const sunMesh = new THREE.Mesh(sunGeometry, sunMat);
sunMesh.castShadow = false;
scene.add(sunMesh);
const sunGlowMat = new THREE.MeshBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.2, side: THREE.BackSide });
const sunGlow = new THREE.Mesh(new THREE.SphereGeometry(2.68, 32, 32), sunGlowMat);
scene.add(sunGlow);
const sunParticles = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xffaa66, size: 0.04, blending: THREE.AdditiveBlending }));
const sunPartPos = [];
for (let i = 0; i < 800; i++) {
    const r = 2.8 + Math.random()*0.6, theta = Math.random()*Math.PI*2, phi = Math.acos(2*Math.random()-1);
    sunPartPos.push(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
}
sunParticles.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(sunPartPos), 3));
scene.add(sunParticles);

// 行星数据
const planetsData = [
    { name: '水星', radius: 0.28, distance: 4.2, speed: 0.0056, color: 0xbc9a6c, useCdn: true, cdnKey: 'mercury', roughness: 0.7, metalness: 0.15, emissive: 0x000000, emissiveIntensity: 0, inclination: (Math.random() - 0.5) * 0.08, realRadius: 2440, realDistance: 57.9, realPeriod: 88 },
    { name: '金星', radius: 0.32, distance: 5.8, speed: 0.0040, color: 0xe6b800, useCdn: true, cdnKey: 'venus', roughness: 0.6, metalness: 0.1, emissive: 0x331100, emissiveIntensity: 0.02, inclination: (Math.random() - 0.5) * 0.08, realRadius: 6052, realDistance: 108.2, realPeriod: 225 },
    { name: '地球', radius: 0.36, distance: 7.5, speed: 0.0034, color: 0x3a86ff, useCdn: false, roughness: 0.5, metalness: 0.1, emissive: 0x001133, emissiveIntensity: 0.005, inclination: (Math.random() - 0.5) * 0.08, realRadius: 6371, realDistance: 149.6, realPeriod: 365 },
    { name: '火星', radius: 0.34, distance: 9.3, speed: 0.0028, color: 0xc45c2c, useCdn: true, cdnKey: 'mars', roughness: 0.4, metalness: 0.2, emissive: 0x441100, emissiveIntensity: 0.05, inclination: (Math.random() - 0.5) * 0.08, realRadius: 3390, realDistance: 227.9, realPeriod: 687 },
    { name: '木星', radius: 1.2, distance: 12.8, speed: 0.0016, color: 0xd8a27a, useCdn: true, cdnKey: 'jupiter', roughness: 0.5, metalness: 0.35, emissive: 0x221100, emissiveIntensity: 0.02, inclination: (Math.random() - 0.5) * 0.06, realRadius: 69911, realDistance: 778.5, realPeriod: 4333 },
    { name: '土星', radius: 1.1, distance: 15.5, speed: 0.0012, color: 0xf0d9b0, useCdn: false, customMaterial: true, customLoader: loadSaturnMaterial, roughness: 0.5, metalness: 0.3, emissive: 0x221100, emissiveIntensity: 0.02, hasRing: true, inclination: (Math.random() - 0.5) * 0.06, realRadius: 58232, realDistance: 1434, realPeriod: 10759 },
    { name: '天王星', radius: 0.8, distance: 18.5, speed: 0.0009, color: 0xb0e0e6, useCdn: true, cdnKey: 'uranus', roughness: 0.5, metalness: 0.2, emissive: 0x004455, emissiveIntensity: 0.02, inclination: (Math.random() - 0.5) * 0.06, realRadius: 25362, realDistance: 2872, realPeriod: 30687 },
    { name: '海王星', radius: 0.78, distance: 21.8, speed: 0.00072, color: 0x4a7db4, useCdn: true, cdnKey: 'neptune', roughness: 0.5, metalness: 0.2, emissive: 0x002244, emissiveIntensity: 0.02, inclination: (Math.random() - 0.5) * 0.06, realRadius: 24622, realDistance: 4495, realPeriod: 60190 }
];

const planets = [];
let earthMesh = null;
const switchableObjects = [];
const labelItems = [];

function getRotatedPosition(distance, angle, inclination) {
    const x0 = Math.cos(angle) * distance;
    const z0 = Math.sin(angle) * distance;
    const y0 = 0;
    const cos = Math.cos(inclination);
    const sin = Math.sin(inclination);
    return new THREE.Vector3(x0, y0 * cos - z0 * sin, y0 * sin + z0 * cos);
}

function createOrbitWithInclination(radius, inclination, color = 0x88aaff) {
    const points = [];
    for (let i = 0; i <= 200; i++) {
        const angle = (i / 200) * Math.PI * 2;
        const pos = getRotatedPosition(radius, angle, inclination);
        points.push(pos);
    }
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const material = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.35 });
    scene.add(new THREE.LineLoop(geometry, material));
}

function createSaturnRing(radius) {
    const ringGroup = new THREE.Group();
    const innerRadius = radius * 1.2;
    const outerRadius = radius * 1.85;
    const geometry = new THREE.RingGeometry(innerRadius, outerRadius, 64);
    const material = new THREE.MeshStandardMaterial({ color: 0xcbb88e, emissive: 0x442200, emissiveIntensity: 0.05, roughness: 0.5, metalness: 0.4, transparent: true, opacity: 0.75, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(geometry, material);
    ring.rotation.x = Math.PI / 2.2;
    ring.rotation.z = 0.2;
    ringGroup.add(ring);
    const innerRingGeo = new THREE.RingGeometry(radius * 1.05, radius * 1.18, 64);
    const innerMat = new THREE.MeshStandardMaterial({ color: 0xeeddbb, roughness: 0.4, metalness: 0.5, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
    const innerRing = new THREE.Mesh(innerRingGeo, innerMat);
    innerRing.rotation.x = Math.PI / 2.2;
    ringGroup.add(innerRing);
    return ringGroup;
}

planetsData.forEach((data, idx) => {
    createOrbitWithInclination(data.distance, data.inclination, idx % 2 === 0 ? 0x77aaff : 0x88bbff);
    
    let material;
    if (data.customMaterial && data.customLoader) {
        material = data.customLoader();
    } else if (data.useCdn) {
        const cdn = cdnTextures[data.cdnKey];
        material = loadCdnMaterial(cdn.map, cdn.normal, data.color, data.roughness, data.metalness, data.emissive, data.emissiveIntensity);
    } else {
        material = loadEarthMaterial();
    }
    
    const planetMesh = new THREE.Mesh(new THREE.SphereGeometry(data.radius, 128, 128), material);
    planetMesh.castShadow = true;
    planetMesh.userData = { speed: data.speed, angle: Math.random() * Math.PI * 2, inclination: data.inclination, realData: data };
    if (data.hasRing) planetMesh.add(createSaturnRing(data.radius));
    if (data.name === '火星') {
        const atmosMat = new THREE.MeshPhongMaterial({ color: 0xcc6644, transparent: true, opacity: 0.05, side: THREE.BackSide });
        const atmos = new THREE.Mesh(new THREE.SphereGeometry(data.radius + 0.04, 64, 64), atmosMat);
        planetMesh.add(atmos);
    }
    scene.add(planetMesh);
    
    const div = document.createElement('div');
    div.textContent = data.name;
    div.style.cssText = `color:#f0f0f0;font-size:13px;font-weight:500;background:rgba(20,20,40,0.7);padding:2px 10px;border-radius:20px;border:1px solid ${new THREE.Color(data.color).getStyle()};backdrop-filter:blur(4px);pointer-events:none;transition:opacity 0.2s`;
    const label = new CSS2DObject(div);
    label.position.set(0, data.radius + 0.3, 0);

// ========== 自动巡游模式 ==========
const tourTargets = [
    { name: '太阳', obj: sunMesh, offset: new THREE.Vector3(0, 3, 8) },
    ...planets.map(p => ({ name: p.name, obj: p.mesh, offset: new THREE.Vector3(0, 1.5, 5) })),
    { name: '月球', obj: moonMesh, offset: new THREE.Vector3(0, 0.8, 3) }
];
let tourActive = true;
let tourIndex = 0;
let tourTimer = null;
let isTweening = false;

function startTour() {
    if (tourTimer) clearTimeout(tourTimer);
    tourActive = true;
    const t = translations[currentLang];
    document.getElementById('auto-tour-btn').textContent = t.tourStop;
    document.getElementById('auto-tour-btn').style.background = 'rgba(80,100,130,0.9)';
    nextTourTarget();
}
function stopTour() {
    tourActive = false;
    if (tourTimer) clearTimeout(tourTimer);
    isTweening = false;
    const t = translations[currentLang];
    document.getElementById('auto-tour-btn').textContent = t.tourStart;
    document.getElementById('auto-tour-btn').style.background = 'rgba(30,50,80,0.9)';
}
function nextTourTarget() {
    if (!tourActive) return;
    if (tourIndex >= tourTargets.length) tourIndex = 0;
    const target = tourTargets[tourIndex];
    if (!target.obj.visible) {
        tourIndex++;
        nextTourTarget();
        return;
    }
    const targetPos = target.obj.position.clone().add(target.offset);
    const startPos = camera.position.clone();
    const startTarget = controls.target.clone();
    isTweening = true;
    new TWEEN.Tween(startPos)
        .to(targetPos, 1500)
        .easing(TWEEN.Easing.Quadratic.InOut)
        .onUpdate(() => camera.position.copy(startPos))
        .start();
    new TWEEN.Tween(startTarget)
        .to(target.obj.position, 1500)
        .easing(TWEEN.Easing.Quadratic.InOut)
        .onUpdate(() => controls.target.copy(startTarget))
        .onComplete(() => {
            isTweening = false;
            tourTimer = setTimeout(() => {
                tourIndex++;
                nextTourTarget();
            }, 10000);
        })
        .start();
}

const tourBtn = document.getElementById('auto-tour-btn');
tourBtn.addEventListener('click', () => {
    if (tourActive) {
        stopTour();
    } else {
        if (tourTimer) clearTimeout(tourTimer);
        if (isTweening) TWEEN.removeAll();
        startTour();
    }
});

// ========== 交互功能：点击行星获取信息 + 追踪 ==========
const raycasterClick = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let currentTrackedPlanet = null;
let isTracking = false;

function showPlanetInfo(planetNameZh, realData) {

function startTracking(planetMesh) {
    if (tourActive) stopTour();
    if (isTracking && currentTrackedPlanet === planetMesh) return;
    currentTrackedPlanet = planetMesh;
    isTracking = true;
    const startPos = camera.position.clone();
    const startTarget = controls.target.clone();
    const offset = new THREE.Vector3(0, 2, 5);
    const targetPos = planetMesh.position.clone().add(offset);
    const targetTarget = planetMesh.position.clone();
    new TWEEN.Tween(startPos)
        .to(targetPos, 600)
        .easing(TWEEN.Easing.Quadratic.InOut)
        .onUpdate(() => camera.position.copy(startPos))
        .start();
    new TWEEN.Tween(startTarget)
        .to(targetTarget, 600)
        .easing(TWEEN.Easing.Quadratic.InOut)
        .onUpdate(() => controls.target.copy(startTarget))
        .start();
    if (planetMesh.material) planetMesh.material.emissiveIntensity = 0.3;
}
function stopTracking() {
    if (!isTracking) return;
    if (currentTrackedPlanet && currentTrackedPlanet.material) {
        currentTrackedPlanet.material.emissiveIntensity = 0.05;
    }
    currentTrackedPlanet = null;
    isTracking = false;
    const startPos = camera.position.clone();
    const startTarget = controls.target.clone();
    const defaultPos = new THREE.Vector3(0, 12, 30);
    const defaultTarget = new THREE.Vector3(0, 0, 0);
    new TWEEN.Tween(startPos)
        .to(defaultPos, 600)
        .easing(TWEEN.Easing.Quadratic.InOut)
        .onUpdate(() => camera.position.copy(startPos))
        .start();
    new TWEEN.Tween(startTarget)
        .to(defaultTarget, 600)
        .easing(TWEEN.Easing.Quadratic.InOut)
        .onUpdate(() => controls.target.copy(startTarget))
        .start();
}

window.addEventListener('click', (event) => {

    mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
    raycasterClick.setFromCamera(mouse, camera);
    const clickableObjects = planets.map(p => p.mesh);
    clickableObjects.push(moonMesh);
    const intersects = raycasterClick.intersectObjects(clickableObjects);
    if (intersects.length > 0) {
        const hit = intersects[0].object;
        let planetNameZh = '';
        let realData = null;
        if (hit === moonMesh) {
            planetNameZh = '月球';
            realData = moonRealData;
        } else {
            const planetObj = planets.find(p => p.mesh === hit);
            if (planetObj) {
                planetNameZh = planetObj.name;
                realData = planetObj.realData;
            }
        }
        if (planetNameZh) {
            showPlanetInfo(planetNameZh, realData);
            startTracking(hit);
        }
    }
});

// 射线检测标签遮挡
const raycasterOcc = new THREE.Raycaster();
function updateLabelsOcclusion() {
    const cameraPos = camera.position;
    planets.forEach(planet => {
        const planetPos = planet.mesh.position;
        const direction = new THREE.Vector3().subVectors(planetPos, cameraPos).normalize();
        raycasterOcc.set(cameraPos, direction);
        const intersects = raycasterOcc.intersectObject(sunMesh);
        let occluded = false;
        if (intersects.length > 0) {
            const hitPoint = intersects[0].point;
            const distToPlanet = cameraPos.distanceTo(planetPos);
            const distToHit = cameraPos.distanceTo(hitPoint);
            if (distToHit < distToPlanet - 0.5) occluded = true;
        }
        if (planet.label) planet.label.element.style.opacity = occluded ? '0' : '1';
    });
    const moonPos = moonMesh.position;
    const moonDir = new THREE.Vector3().subVectors(moonPos, cameraPos).normalize();
    raycasterOcc.set(cameraPos, moonDir);
    const moonIntersects = raycasterOcc.intersectObject(sunMesh);
    let moonOccluded = false;
    if (moonIntersects.length > 0) {
        const hitPoint = moonIntersects[0].point;
        const distToMoon = cameraPos.distanceTo(moonPos);
        const distToHit = cameraPos.distanceTo(hitPoint);
        if (distToHit < distToMoon - 0.5) moonOccluded = true;
    }
    moonLabel.element.style.opacity = moonOccluded ? '0' : '1';
}

// 动画循环
let time = 0;
const basePlanetRotSpeed = 0.0024;
const baseMoonRotSpeed = 0.003;
function animate() {
    requestAnimationFrame(animate);
    TWEEN.update();
    time += 0.008;
    if (sunMesh.visible) {
        sunMesh.rotation.y += 0.003;
        sunGlow.rotation.y += 0.001;
        sunParticles.rotation.y += 0.002;
    }
    planets.forEach(p => {
        p.angle += p.baseSpeed * orbitSpeedFactor * 0.6;
        if (p.angle > Math.PI*2) p.angle -= Math.PI*2;
        const pos = getRotatedPosition(p.distance, p.angle, p.inclination);
        p.mesh.position.copy(pos);
        if (p.mesh.visible) p.mesh.rotation.y += basePlanetRotSpeed * rotationSpeedFactor;
        if (p.hasRing && p.ringGroup && p.mesh.visible) p.ringGroup.rotation.y += 0.001;
    });
    if (earthMesh) {
        moonAngle += moonBaseSpeed * orbitSpeedFactor * 0.6;
        if (moonAngle > Math.PI*2) moonAngle -= Math.PI*2;
        const offsetX = Math.cos(moonAngle) * moonDistance;
        const offsetZ = Math.sin(moonAngle) * moonDistance;
        moonMesh.position.set(earthMesh.position.x + offsetX, Math.sin(moonAngle*2)*0.05, earthMesh.position.z + offsetZ);
        if (moonMesh.visible) moonMesh.rotation.y += baseMoonRotSpeed * rotationSpeedFactor;
    }
    asteroidField.rotation.y += 0.001;
    stars.rotation.y += 0.0003;
    stars2.rotation.x += 0.0002;
    dustField.rotation.y += 0.0005;
    const intensity = 1.5 + Math.sin(time*3)*0.12;
    sunLight.intensity = intensity;
    sunGlow.material.opacity = 0.2 + Math.sin(time*2)*0.05;
    updateLabelsOcclusion();
    if (isTracking && currentTrackedPlanet) {
        controls.target.lerp(currentTrackedPlanet.position, 0.05);
    }
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
}
animate();

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

});
