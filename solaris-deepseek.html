<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Solar System</title>
</head>
<body>
<div class="control-panel" id="controlPanel">
    <div class="panel-header">
        <h1 id="panel-title">🌌 3D 太阳系</h1>
        <div class="header-buttons">
            <button id="lang-switch-btn" class="header-btn">EN</button>
            <button id="minimizeBtn" class="minimize-btn">−</button>
        </div>
    </div>
    <div class="panel-main">
        <div class="sub" id="panel-subtitle">⚡ 双速度调节 | 平滑巡游 | 土星真实纹理</div>
        <div class="planet-grid" id="planet-grid"></div>
        <div class="speed-control">
            <div class="speed-label"><span id="orbit-speed-label">🚀 公转速度倍率</span><span class="speed-value" id="orbitSpeedValue">1.00 x</span></div>
            <input type="range" id="orbitSpeedSlider" min="0.1" max="2.0" step="0.01" value="1.0">
        </div>
        <div class="speed-control" style="border-top: none; margin-top: -4px;">
            <div class="speed-label"><span id="rotation-speed-label">🔄 自转速度倍率</span><span class="speed-value" id="rotationSpeedValue">1.00 x</span></div>
            <input type="range" id="rotationSpeedSlider" min="0.1" max="2.0" step="0.01" value="1.0">
        </div>
        <div class="button-group">
            <div id="toggle-labels-btn" class="ctrl-btn">🏷️ 隐藏名称</div>
            <div id="auto-tour-btn" class="ctrl-btn">🔁 停止巡游</div>
        </div>
        <div class="footer-note" id="panel-footer">✨ 点击行星追踪/信息 | 自动巡游默认开启</div>
    </div>
    <div class="panel-mini-logo" id="panelMiniLogo">🌌</div>
</div>
<div class="mini-hint">🪐 平滑巡游(10秒/行星) | 点击可中断</div>
<div id="loadingTip" class="loading-tip">生成纹理中...</div>
<div id="infoPanel" class="info-panel" style="display: none;">
    <span class="close-info" id="closeInfoBtn">&times;</span>
    <h4 id="infoName">行星名称</h4>
    <p id="infoRadius"><span id="radiusLabel">🌍 半径</span>: <span id="radiusValue">--</span> <span id="radiusUnit">km</span></p>
    <p id="infoDistance"><span id="distanceLabel">📡 距日距离</span>: <span id="distanceValue">--</span> <span id="distanceUnit">百万 km</span></p>
    <p id="infoOrbitPeriod"><span id="periodLabel">⏱️ 公转周期</span>: <span id="periodValue">--</span> <span id="periodUnit">地球日</span></p>
    <div id="resetViewBtn" class="reset-view-btn">🎥 重置全局视角</div>
</div>

<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
</script>

<script type="module" src="./solaris-deepseek.js"></script>
</body>
</html>
